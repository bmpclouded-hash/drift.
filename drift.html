      </div>
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••">
      <button class="auth-submit" id="authSubmit">${state.authFormMode==='signin' ? 'Sign In' : 'Create Account'}</button>
      <div class="auth-error" id="authError"></div>
      <div class="auth-note">Signing in unlocks real member pricing, free cooler-fill ice at higher tiers, and points earned from orders and logged catches — in either app.</div>
    </div>`;
  } else if (!state.isMember){
    html += `
    <div class="points-card">
      <div class="points-label">SIGNED IN AS</div>
      <div style="font-size:13px;margin-bottom:12px;">${state.customerEmail}</div>
      <div class="points-sub">Having an Angr or Drift login doesn't automatically enroll you — join to start earning points from real orders and logged catches.</div>
      <label style="display:block;margin-top:12px;font-size:11px;font-weight:700;color:#8FE0E6;">Referral code (optional)</label>
      <input type="text" id="referralCodeInput" placeholder="e.g. A1B2C3D4" maxlength="8" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--input-border);font-family:'Manrope';font-size:13px;margin-top:4px;text-transform:uppercase;">
      <button class="redeem-btn" id="joinRewardsBtn" style="width:100%;margin-top:12px;">Join Drift Rewards</button>
    </div>
    <div class="section-note">Manage your phone, payment method, and password on the Settings tab.</div>`;
  } else {
    const tier = currentTier();
    const next = nextTier(state.loyaltyPoints);
    const progressPct = next ? Math.min(100, Math.round((state.loyaltyPoints - tier.minPoints) / (next.minPoints - tier.minPoints) * 100)) : 100;
    html += `
    <div class="points-card">
      <div class="points-label">SIGNED IN AS</div>
      <div style="font-size:13px;margin-bottom:10px;">${state.customerEmail}${state.staffMode ? ' <span style="opacity:.7;">(crew)</span>' : ''}</div>
      <div class="points-label">LOYALTY POINTS</div>
      <div class="points-value">${state.loyaltyPoints}</div>
      <div class="points-progress-track"><div class="points-progress-fill" style="width:${progressPct}%;"></div></div>
      <div class="points-sub">${next ? `${next.minPoints - state.loyaltyPoints} points to ${next.name}` : 'Top tier reached'}</div>
      ${state.isDualApp ? `<div class="dual-app-badge">🎣 Dual-App Boater — +${DUAL_APP_BONUS_PERCENT}% bonus discount</div>` : `<div class="points-sub" style="margin-top:8px;">Log a catch in Angr to unlock the Dual-App bonus discount.</div>`}
      ${state.customerId ? `<div class="dual-app-badge" style="background:rgba(255,255,255,.15);">🎁 Your referral code: ${state.customerId.slice(-8).toUpperCase()}</div>` : ''}
    </div>`;

    if (MY_REDEMPTIONS.length){
      html += `<div class="section-title" style="font-size:15px;">Your active codes</div>`;
      MY_REDEMPTIONS.forEach(r=>{
        html += `<div class="my-code-card">
          <div class="my-code-name">${r.reward ? r.reward.name : 'Reward'}</div>
          <div class="my-code-value">${r.code}</div>
          <div class="my-code-hint">Show this to the crew — or enter it in your cart at checkout.</div>
        </div>`;
      });
    }

    html += `<div class="section-title" style="font-size:15px;">Redeem Points</div>
      <div class="section-note">Spend points on real perks. Requires at least one completed order first.</div>`;
    REWARDS.filter(r => r.active).forEach(r=>{
      const canAfford = state.loyaltyPoints >= r.points_cost;
      html += `<div class="reward-card ${canAfford?'':'locked'}">
        <div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-desc">${r.description || ''}</div>
          <div class="reward-cost">${r.points_cost} pts</div>
        </div>
        <button class="redeem-btn" data-redeem="${r.id}" ${canAfford?'':'disabled'}>Redeem</button>
      </div>`;
    });

    html += `<div class="section-note">Manage your phone, payment method, and password on the Settings tab.</div>`;
  }

  html += `<div class="section-title" style="font-size:16px;">How tiers work</div>
    <div class="section-note">Earned through real activity — 1 point per $1 spent on a completed order, 5 points per catch logged (Angr or Drift). No subscription, nothing to cancel.</div>`;
  TIERS.forEach(t=>{
    const active = state.customerId && t.id === currentTier().id;
    html += `<div class="tier-card ${active?'active':''}">
      <div class="tier-top">
        <div class="tier-name">${t.name}</div>
        <div class="tier-price">${t.minPoints}+ pts</div>
      </div>
      ${active ? '<div class="tier-badge">YOUR CURRENT TIER</div>' : ''}
      <ul class="tier-perks">${t.perks.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>`;
  });

  html += `<div class="section-title" style="font-size:16px;margin-top:20px;">Captain's Club</div>
    <div class="section-note">A separate paid track that instantly guarantees a tier, no points required. Cancel anytime from the email receipt Stripe sends you.</div>`;
  PAID_TIERS.forEach(pt=>{
    const link = state.customerId
      ? `${pt.paymentLink}?client_reference_id=${state.customerId}&prefilled_email=${encodeURIComponent(state.customerEmail)}`
      : null;
    html += `<div class="tier-card">
      <div class="tier-top">
        <div class="tier-name">${pt.name}</div>
        <div class="tier-price">${pt.price}</div>
      </div>
      <div class="tier-perks" style="padding-left:0;list-style:none;margin-bottom:10px;">${pt.desc}</div>
      ${link
        ? `<a href="${link}" target="_blank" rel="noopener" class="redeem-btn" style="display:block;text-align:center;text-decoration:none;">Subscribe</a>`
        : `<div class="section-note" style="margin:0;">Sign in above to subscribe.</div>`
      }
    </div>`;
  });

  appBody.innerHTML = html;

  appBody.querySelectorAll('[data-authmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.authFormMode = btn.dataset.authmode; render(); });
  });
  const authSubmit = appBody.querySelector('#authSubmit');
  if (authSubmit) authSubmit.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';
    if (!email || password.length < 6){ errEl.textContent = 'Enter a valid email and a password (6+ characters).'; return; }
    const { data, error } = state.authFormMode === 'signin'
      ? await manualSignInWithPassword(email, password)
      : await sb.auth.signUp({ email, password });
    if (error){ errEl.textContent = error.message; return; }
    if (state.authFormMode === 'signup' && !data.session){
      errEl.textContent = '';
      showToast('Check your email to confirm your account, then sign in.');
      return;
    }
    await onCustomerSignedIn(data.session.user);
    if (state.staffMode) await fetchActiveOrders();
    showToast(state.staffMode ? 'Signed in — crew access unlocked' : 'Signed in — welcome to Drift');
    render();
  });

  const joinBtn = appBody.querySelector('#joinRewardsBtn');
  if (joinBtn) joinBtn.addEventListener('click', async ()=>{
    joinBtn.disabled = true;
    const codeInput = document.getElementById('referralCodeInput');
    const code = codeInput ? codeInput.value.trim() : '';
    let referredBy = null;
    if (code){
      const { data: resolvedId } = await sb.rpc('resolve_referral_code', { p_code: code });
      if (resolvedId) referredBy = resolvedId;
      else showToast('Referral code not recognized — joining without it');
    }
    const { error } = await sb.from('drift_members').insert({ user_id: state.customerId, referred_by: referredBy });
    if (error){
      showToast('Could not join — try again');
      joinBtn.disabled = false;
      return;
    }
    state.isMember = true;
    await fetchLoyaltyPoints();
    showToast(referredBy ? 'Welcome! Referral applied — bonus points on your first order.' : 'Welcome to Drift Rewards!');
    render();
  });

  appBody.querySelectorAll('[data-redeem]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const { data, error } = await sb.rpc('redeem_reward', { p_reward_id: btn.dataset.redeem });
      if (error){ showToast(error.message || 'Could not redeem'); btn.disabled = false; return; }
      await Promise.all([fetchLoyaltyPoints(), fetchMyRedemptions()]);
      showToast(`Redeemed! Code: ${data.code}`);
      render();
    });
  });
}

async function signOutCustomer(){
  await sb.auth.signOut();
  currentAuthUserId = null;
  state.customerId = null;
  state.customerEmail = null;
  state.loyaltyPoints = 0;
  state.isDualApp = false;
  state.subscription = null;
  state.staffMode = false;
  state.isMember = false;
  MY_REDEMPTIONS = [];
  if (state.tab === 'orders' || state.tab === 'manage') state.tab = 'shop';
  render();
}

async function onCustomerSignedIn(user){
  state.customerId = user.id;
  state.customerEmail = user.email;
  currentAuthUserId = user.id;
  await Promise.all([fetchLoyaltyPoints(), checkDualAppStatus(), fetchSubscription(), checkStaffRole(), fetchMyRedemptions(), checkMembership(), fetchMyOrders()]);
}

async function checkMembership(){
  if (!state.customerId) { state.isMember = false; return; }
  const { data } = await sb.from('drift_members').select('user_id').eq('user_id', state.customerId).maybeSingle();
  state.isMember = !!data;
}

async function fetchLoyaltyPoints(){
  if (!state.customerId) return;
  const { data } = await sb.from('drift_loyalty').select('points').eq('user_id', state.customerId).maybeSingle();
  state.loyaltyPoints = data ? data.points : 0;
}

async function checkDualAppStatus(){
  if (!state.customerId) return;
  const { count } = await sb.from('catches').select('id', { count:'exact', head:true }).eq('user_id', state.customerId);
  state.isDualApp = (count || 0) > 0;
}

async function fetchSubscription(){
  if (!state.customerId) return;
  const { data } = await sb.from('drift_subscriptions').select('*').eq('user_id', state.customerId).maybeSingle();
  state.subscription = data || null;
}

async function fetchSettings(){
  const { data, error } = await sb.from('drift_settings').select('*').eq('id', 1).single();
  if (error) return;
  SETTINGS = data;
  const free = TIERS.find(t => t.id === 'free');
  if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
}

async function fetchRewards(){
  // No active-only filter here — RLS itself only returns inactive rows
  // to the owner, so a plain customer never sees them regardless.
  const { data, error } = await sb.from('drift_rewards').select('*').order('points_cost');
  if (!error) REWARDS = data || [];
}

async function fetchMyRedemptions(){
  if (!state.customerId) { MY_REDEMPTIONS = []; return; }
  const { data, error } = await sb.from('drift_redemptions')
    .select('*, reward:drift_rewards(*)')
    .eq('user_id', state.customerId)
    .eq('status', 'pending')
    .order('redeemed_at', { ascending:false });
  if (!error) MY_REDEMPTIONS = data || [];
}

async function fetchMyOrders(){
  if (!state.customerId) { MY_ORDERS = []; return; }
  const { data, error } = await sb.from('drift_orders')
    .select('*')
    .eq('user_id', state.customerId)
    .order('created_at', { ascending:false })
    .limit(20);
  if (!error) MY_ORDERS = data || [];
}

async function checkStaffRole(){
  if (state.ownerMode) return; // owner already has full access
  try {
    const { data } = await sb.rpc('is_staff');
    state.staffMode = !!data;
  } catch(e){ state.staffMode = false; }
}

      <button class="add-submit" id="addProdBtn">Add to ${CATALOG[state.manageCat] ? CATALOG[state.manageCat].label : ''}</button>
    </div>
    <button class="advance-btn" id="openSettingsBtn" style="margin-top:20px;">⚙ Settings</button>`;
  }
  html += `<button class="hail-btn" id="exitOwnerBtn" style="margin-top:12px;background:none;border:1.5px solid var(--input-border);color:var(--heading);">Sign Out</button>`;

  appBody.innerHTML = html;

  const openSettingsBtn = appBody.querySelector('#openSettingsBtn');
  if (openSettingsBtn) openSettingsBtn.addEventListener('click', ()=>{ state.showSettings = true; render(); });

  const exitOwnerBtn = appBody.querySelector('#exitOwnerBtn');
  if (exitOwnerBtn) exitOwnerBtn.addEventListener('click', async ()=>{
    if (liveTrackingWatchId){ navigator.geolocation.clearWatch(liveTrackingWatchId); liveTrackingWatchId = null; }
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.ownerMode = false;
    state.staffMode = false;
    state.showSettings = false;
    state.tab = 'shop';
    render();
  });

  const liveTrackBtn = appBody.querySelector('#liveTrackBtn');
  if (liveTrackBtn) liveTrackBtn.addEventListener('click', ()=>{
    if (liveTrackingWatchId){
      navigator.geolocation.clearWatch(liveTrackingWatchId);
      liveTrackingWatchId = null;
      showToast('Live tracking stopped');
      renderManage();
      return;
    }
    if (!navigator.geolocation){ showToast('GPS not available on this device'); return; }
    liveTrackingWatchId = navigator.geolocation.watchPosition(
      async (pos)=>{
        const { data, error } = await sb.from('drift_boat_status').update({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          current_stop_name: null,
          updated_at: new Date().toISOString()
        }).eq('id', 1).select().single();
        if (!error && data) BOAT = data;
      },
      (err)=>{ showToast('GPS error: ' + err.message); },
      { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
    );
    showToast('Live tracking started — your real position now updates for everyone');
    renderManage();
  });

  appBody.querySelectorAll('[data-jump]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const stop = ROUTE.find(s=>s.name===btn.dataset.jump);
      if (!stop) return;
      const { data, error } = await sb.from('drift_boat_status').update({
        lat: stop.lat, lng: stop.lng, current_stop_name: stop.name, updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();
      if (!error && data){ BOAT = data; showToast(`Now at ${stop.name}`); render(); }
    });
  });

  const startCountBtn = appBody.querySelector('#startCountBtn');
  if (startCountBtn) startCountBtn.addEventListener('click', ()=>{
    state.countMode = true;
    state.countIndex = 0;
    render();
  });

  appBody.querySelectorAll('[data-mcat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.manageCat = btn.dataset.mcat; state.editingIndex = null; render(); });
  });
  appBody.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editingIndex = Number(btn.dataset.edit); render(); });
  });
  appBody.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = Number(btn.dataset.save);
      const item = CATALOG[state.manageCat].items[i];
      const updates = {};
      const priceEl = document.getElementById('editPrice');
      if (priceEl){
        const val = parseFloat(priceEl.value);
        if (!isNaN(val) && val >= 0) updates.price = val;
      }
      const isServiceEl = document.getElementById('editIsService');
      const stockEl = document.getElementById('editStock');
      if (isServiceEl){
        if (isServiceEl.checked){
          updates.stock = null;
        } else if (stockEl){
          const sval = parseInt(stockEl.value, 10);
          if (isNaN(sval) || sval < 0){ showToast('Enter a starting stock count'); return; }
          updates.stock = sval;
        }
      }
      const swatchEl = document.getElementById('editSwatch');
      if (swatchEl) updates.swatch_hex = swatchEl.value;
      const { data, error } = await sb.from('drift_products').update(updates).eq('id', item.id).select().single();
      if (error){ showToast(error.message.includes('owner') ? 'Only the owner can change prices' : 'Update failed — are you still signed in?'); return; }
      if (updates.price !== undefined) item.p = data.price;
      if (updates.hasOwnProperty('stock')) item.stock = data.stock;
      if (updates.swatch_hex !== undefined) item.swatch = data.swatch_hex;

      const costEl = document.getElementById('editCost');
      const pointsEl = document.getElementById('editPointsValue');
      if (costEl || pointsEl){
        const costVal = costEl && costEl.value !== '' ? parseFloat(costEl.value) : null;
        const pointsVal = pointsEl && pointsEl.value !== '' ? parseInt(pointsEl.value, 10) : null;
        const { error: intErr } = await sb.from('drift_product_internal')
          .upsert({ product_id: item.id, cost: costVal, points_value: pointsVal, updated_at: new Date().toISOString() });
        if (!intErr){ item.cost = costVal; item.pointsValue = pointsVal; }
      }

      state.editingIndex = null;
      showToast('Product updated');
      render();
    });
  });

  const imageFileInput = appBody.querySelector('#editImageFile');
  if (imageFileInput) imageFileInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const productId = imageFileInput.dataset.productId;
    const item = Object.values(CATALOG).flatMap(c=>c.items).find(p=>p.id===productId);
    const newUrls = [];
    for (const file of files){
      if (file.size > 5 * 1024 * 1024){ showToast(`Skipped ${file.name} — over 5MB`); continue; }
      showToast(`Uploading ${file.name}…`);
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${productId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: uploadErr } = await sb.storage.from('product-images').upload(path, file, { upsert: true });
      if (uploadErr){ showToast(`Upload failed for ${file.name}`); continue; }
      const { data: urlData } = sb.storage.from('product-images').getPublicUrl(path);
      newUrls.push(urlData.publicUrl);
    }
    if (!newUrls.length) return;
    const combined = [...(item && item.images ? item.images : []), ...newUrls];
    const { error: updateErr } = await sb.from('drift_products').update({ image_urls: combined, image_url: combined[0] }).eq('id', productId);
    if (updateErr){ showToast('Could not save photos — are you still signed in?'); return; }
    if (item){ item.images = combined; item.image = combined[0]; }
    showToast(`Added ${newUrls.length} photo${newUrls.length>1?'s':''}`);
    render();
  });

  appBody.querySelectorAll('[data-remove-image]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const productId = btn.dataset.removeImage;
      const imgIdx = Number(btn.dataset.imageIndex);
      const item = Object.values(CATALOG).flatMap(c=>c.items).find(p=>p.id===productId);
      if (!item || !item.images) return;
      const updated = item.images.filter((_,idx)=>idx!==imgIdx);
      const { error } = await sb.from('drift_products').update({ image_urls: updated, image_url: updated[0] || null }).eq('id', productId);
      if (error){ showToast('Could not remove photo'); return; }
      item.images = updated;
      item.image = updated[0] || null;
      showToast('Photo removed');
      render();
    });
  });

  appBody.querySelectorAll('[data-manage-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const [itemIdx, imgIdx] = img.dataset.manageLightbox.split(':').map(Number);
      const item = CATALOG[state.manageCat].items[itemIdx];
      if (item && item.images && item.images.length) openLightbox(item.images, imgIdx);
    });
  });

  const editIsServiceEl = appBody.querySelector('#editIsService');
  if (editIsServiceEl) editIsServiceEl.addEventListener('change', ()=>{
    const field = document.getElementById('stockToggleField');
    if (field) field.style.display = editIsServiceEl.checked ? 'none' : 'block';
  });

  const clearSwatchBtn = appBody.querySelector('#clearSwatchBtn');
  if (clearSwatchBtn) clearSwatchBtn.addEventListener('click', async ()=>{
    const item = CATALOG[state.manageCat].items[state.editingIndex];
    const { error } = await sb.from('drift_products').update({ swatch_hex: null }).eq('id', item.id);
    if (error){ showToast('Could not clear swatch'); return; }
    item.swatch = null;
    showToast('Swatch cleared');
    render();
  });

  appBody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = Number(btn.dataset.del);
      const item = CATALOG[state.manageCat].items[i];
      if (!confirm(`Remove "${item.n}" from the menu?`)) return;
      const { error } = await sb.from('drift_products').delete().eq('id', item.id);
      if (error){ showToast('Delete failed — are you still signed in?'); return; }
      CATALOG[state.manageCat].items.splice(i, 1);
      state.editingIndex = null;
      showToast('Product removed');
      render();
    });
  });
  const addBtn = appBody.querySelector('#addProdBtn');
  if (addBtn) addBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('newProdName').value.trim();
    const price = parseFloat(document.getElementById('newProdPrice').value);
    const stockRaw = document.getElementById('newProdStock').value;
    const stock = stockRaw === '' ? null : parseInt(stockRaw, 10);
    const imageFiles = Array.from(document.getElementById('newProdImage').files || []);
    if (!name || isNaN(price) || price < 0) return;
    const { data, error } = await sb.from('drift_products').insert({
      category: state.manageCat, name, price, stock: (stock === null || isNaN(stock)) ? null : stock
    }).select().single();
    if (error){ showToast('Add failed — are you still signed in?'); return; }

    const imageUrls = [];
    for (const file of imageFiles){
      if (file.size > 5 * 1024 * 1024){ showToast(`Skipped ${file.name} — over 5MB`); continue; }
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${data.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: uploadErr } = await sb.storage.from('product-images').upload(path, file, { upsert: true });
      if (uploadErr) continue;
      const { data: urlData } = sb.storage.from('product-images').getPublicUrl(path);
      imageUrls.push(urlData.publicUrl);
    }
    if (imageUrls.length){
      await sb.from('drift_products').update({ image_urls: imageUrls, image_url: imageUrls[0] }).eq('id', data.id);
    }

    CATALOG[state.manageCat].items.push({ id:data.id, n:data.name, p:Number(data.price), stock:data.stock, image:imageUrls[0] || null, images:imageUrls });
    showToast(`Added ${name}${imageUrls.length ? ` with ${imageUrls.length} photo${imageUrls.length>1?'s':''}` : ''}`);
    document.getElementById('newProdName').value = '';
    document.getElementById('newProdPrice').value = '';
    document.getElementById('newProdStock').value = '';
    document.getElementById('newProdImage').value = '';
    render();
  });
}

    <div class="settings-section">

    <div class="section-title" style="font-size:16px;">Rewards Catalog</div>
    <div class="section-note">What points can buy. Inactive rewards stay hidden from customers but keep working for anyone who already redeemed them.</div>`;

    if (editing){

          <div class="reward-edit-full"><label>Name</label><input type="text" id="rewEditName" value="${r.name}"></div>
          <div class="reward-edit-full"><label>Description</label><input type="text" id="rewEditDesc" value="${r.description || ''}"></div>
          <div><label>Points cost</label><input type="number" id="rewEditCost" value="${r.points_cost}"></div>
          <div><label>Type</label>
            <select id="rewEditType">
              <option value="discount_amount" ${r.reward_type==='discount_amount'?'selected':''}>$ off order</option>

            </select>
          </div>
          <div><label>Discount $ (if $ off)</label><input type="number" step="0.5" id="rewEditDiscount" value="${r.discount_amount != null ? r.discount_amount : ''}"></div>
          <div><label>Product name (if free item)</label><input type="text" id="rewEditItem" value="${r.free_item_name || ''}" placeholder="Must match exactly"></div>
        </div>
        <div class="reward-manage-actions">
          <button class="reward-manage-btn" data-save-reward="${r.id}" style="background:var(--rust);color:#fff;border-color:var(--rust);">Save</button>
          <button class="reward-manage-btn" data-cancel-reward>Cancel</button>
        </div>
      </div>`;
    } else {
      html += `<div class="reward-manage-card">
        <div class="reward-manage-top">
          <div class="reward-manage-name">${r.name}</div>
          <div class="reward-manage-badge ${r.active?'active':'inactive'}">${r.active?'Active':'Hidden'}</div>
        </div>
        <div class="reward-manage-meta">${r.points_cost} pts · ${r.reward_type==='discount_amount' ? `$${Number(r.discount_amount).toFixed(2)} off` : `Free: ${r.free_item_name}`}</div>
        ${r.description ? `<div class="reward-manage-meta">${r.description}</div>` : ''}
        <div class="reward-manage-actions">
          <button class="reward-manage-btn" data-edit-reward="${r.id}">Edit</button>
          <button class="reward-manage-btn" data-toggle-reward="${r.id}" data-currently-active="${r.active}">${r.active?'Hide':'Unhide'}</button>
          <button class="reward-manage-btn danger" data-delete-reward="${r.id}">Delete</button>

  html += `<button class="advance-btn" id="showAddRewardBtn" style="background:var(--teal);">${state.showAddReward ? '– Cancel' : '+ Add New Reward'}</button>`;

  if (state.showAddReward){
    html += `<div class="reward-manage-card">
      <div class="reward-edit-grid">
        <div class="reward-edit-full"><label>Name</label><input type="text" id="newRewardName" placeholder="e.g. Free Sunscreen"></div>
        <div class="reward-edit-full"><label>Description</label><input type="text" id="newRewardDesc" placeholder="Optional"></div>
        <div><label>Points cost</label><input type="number" id="newRewardCost" placeholder="e.g. 100"></div>
        <div><label>Type</label>
          <select id="newRewardType">
            <option value="discount_amount">$ off order</option>
            <option value="free_item">Free item</option>
          </select>
        </div>
        <div><label>Discount $ (if $ off)</label><input type="number" step="0.5" id="newRewardDiscount" placeholder="5.00"></div>
        <div><label>Product name (if free item)</label><input type="text" id="newRewardItem" placeholder="Must match exactly"></div>
      </div>
      <button class="reward-manage-btn" id="saveNewRewardBtn" style="width:100%;margin-top:10px;background:var(--rust);color:#fff;border-color:var(--rust);">Add Reward</button>
    </div>`;
  }

  html += `<button class="hail-btn" id="backToManageBtn" style="margin-top:10px;background:none;border:1.5px solid var(--input-border);color:var(--heading);">← Back to Manage</button>`;

  appBody.innerHTML = html;

  document.getElementById('backToManageBtn').addEventListener('click', ()=>{
    state.showSettings = false;
    state.editingRewardId = null;
    state.showAddReward = false;
    render();
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const announcement = document.getElementById('setAnnouncement').value.trim();
    const threshold = parseInt(document.getElementById('setThreshold').value, 10);
    const isOpen = document.getElementById('setIsOpen').checked;
    const { data, error } = await sb.from('drift_settings').update({
      announcement: announcement || null,
      confirm_threshold_base: isNaN(threshold) ? SETTINGS.confirm_threshold_base : threshold,
      is_open: isOpen,
      updated_at: new Date().toISOString()
    }).eq('id', 1).select().single();
    if (error){ showToast('Could not save settings'); return; }
    SETTINGS = data;
    const free = TIERS.find(t => t.id === 'free');
    if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
    showToast('Settings saved');
    render();
  });

  loadStaffList();

  document.getElementById('addStaffBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('newStaffEmail').value.trim().toLowerCase();
    if (!email || !email.includes('@')) return;
    const { error } = await sb.from('drift_staff').insert({ email });
    if (error){ showToast('Could not add — already added?'); return; }
    document.getElementById('newStaffEmail').value = '';
    showToast(`Added ${email} as crew`);
    loadStaffList();
  });

  appBody.querySelectorAll('[data-edit-reward]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editingRewardId = btn.dataset.editReward; state.showAddReward = false; render(); });
  });
  appBody.querySelectorAll('[data-cancel-reward]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editingRewardId = null; render(); });
  });
  appBody.querySelectorAll('[data-save-reward]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveReward;
      const name = document.getElementById('rewEditName').value.trim();
      const description = document.getElementById('rewEditDesc').value.trim();
      const points_cost = parseInt(document.getElementById('rewEditCost').value, 10);
      const reward_type = document.getElementById('rewEditType').value;
      const discountRaw = document.getElementById('rewEditDiscount').value;
      const itemRaw = document.getElementById('rewEditItem').value.trim();
      if (!name || isNaN(points_cost) || points_cost <= 0){ showToast('Enter a name and a valid points cost'); return; }
      const { error } = await sb.from('drift_rewards').update({
        name, description: description || null, points_cost, reward_type,
        discount_amount: reward_type === 'discount_amount' ? (parseFloat(discountRaw) || 0) : null,
        free_item_name: reward_type === 'free_item' ? (itemRaw || null) : null
      }).eq('id', id);
      if (error){ showToast('Could not save reward'); return; }
      state.editingRewardId = null;
      await fetchRewards();
      showToast('Reward updated');
      render();
    });
  });
  appBody.querySelectorAll('[data-toggle-reward]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const currentlyActive = btn.dataset.currentlyActive === 'true';
      const { error } = await sb.from('drift_rewards').update({ active: !currentlyActive }).eq('id', btn.dataset.toggleReward);
      if (error){ showToast('Could not update reward'); return; }
      await fetchRewards();
      showToast(currentlyActive ? 'Reward hidden from customers' : 'Reward is visible again');
      render();
    });
  });
  appBody.querySelectorAll('[data-delete-reward]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if (!confirm('Delete this reward permanently? This fails if anyone has already redeemed it — hide it instead if that\u2019s the case.')) return;
      const { error } = await sb.from('drift_rewards').delete().eq('id', btn.dataset.deleteReward);
      if (error){ showToast('Could not delete — probably already redeemed by someone. Try hiding it instead.'); return; }
      await fetchRewards();
      showToast('Reward deleted');
      render();
    });
  });
  const showAddRewardBtn = appBody.querySelector('#showAddRewardBtn');
  if (showAddRewardBtn) showAddRewardBtn.addEventListener('click', ()=>{
    state.showAddReward = !state.showAddReward;
    state.editingRewardId = null;
    render();
  });
  const saveNewRewardBtn = appBody.querySelector('#saveNewRewardBtn');
  if (saveNewRewardBtn) saveNewRewardBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('newRewardName').value.trim();
    const description = document.getElementById('newRewardDesc').value.trim();
    const points_cost = parseInt(document.getElementById('newRewardCost').value, 10);
    const reward_type = document.getElementById('newRewardType').value;
    const discountRaw = document.getElementById('newRewardDiscount').value;
    const itemRaw = document.getElementById('newRewardItem').value.trim();
    if (!name || isNaN(points_cost) || points_cost <= 0){ showToast('Enter a name and a valid points cost'); return; }
    if (reward_type === 'free_item' && !itemRaw){ showToast('Enter the exact product name for a free item'); return; }
    const { error } = await sb.from('drift_rewards').insert({
      name, description: description || null, points_cost, reward_type,
      discount_amount: reward_type === 'discount_amount' ? (parseFloat(discountRaw) || 0) : null,
      free_item_name: reward_type === 'free_item' ? itemRaw : null
    });
    if (error){ showToast('Could not add reward'); return; }
    state.showAddReward = false;
    await fetchRewards();
    showToast(`Added ${name}`);
    render();
  });
}

async function loadStaffList(){
  const { data, error } = await sb.from('drift_staff').select('*').order('added_at');
  const el = document.getElementById('staffList');
  if (!el) return;
  if (error){ el.innerHTML = 'Could not load staff list.'; return; }
  if (!data.length){ el.innerHTML = '<div class="section-note" style="margin:0;">No crew added yet.</div>'; return; }
  el.innerHTML = data.map(s => `
    <div class="staff-row">
      <span>${s.email}</span>
      <button class="staff-remove" data-removestaff="${s.email}">✕</button>
    </div>`).join('');
  el.querySelectorAll('[data-removestaff]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await sb.from('drift_staff').delete().eq('email', btn.dataset.removestaff);
      showToast('Crew member removed');
      loadStaffList();
    });
  });
}

function flatItems(){
  const flat = [];
  Object.entries(CATALOG).forEach(([cat, data])=>{
    data.items.forEach((item, idx)=> flat.push({cat, idx, item}));
  });
  return flat;
}

function renderCountMode(){
  const flat = flatItems();
  if (!flat.length){ state.countMode = false; renderManage(); return; }
  if (state.countIndex >= flat.length) state.countIndex = flat.length - 1;
  const entry = flat[state.countIndex];
  const item = entry.item;
  const isService = item.stock === null;

  let html = `
    <div class="manage-banner">Inventory Count — item ${state.countIndex+1} of ${flat.length}</div>
    <div class="count-card">
      <div class="count-cat">${CATALOG[entry.cat].label}</div>
      <div class="count-name">${item.n}</div>
      ${isService
        ? `<div class="count-service-note">This is a service item (unlimited) — nothing to count.</div>`
        : `<div class="count-stepper">
            <button class="count-btn" id="countMinus">−</button>
            <div class="count-value" id="countValue">${item.stock}</div>
            <button class="count-btn" id="countPlus">+</button>
          </div>
          <input type="number" class="count-direct" id="countDirect" value="${item.stock}">`
      }
    </div>
    <div class="count-nav">
      <button class="count-nav-btn" id="countPrev" ${state.countIndex===0?'disabled':''}>← Prev</button>
      <button class="count-nav-btn primary" id="countNext">${state.countIndex === flat.length-1 ? 'Finish Count' : 'Next →'}</button>
    </div>
    <button class="hail-btn" id="exitCount" style="margin-top:14px;background:none;border:1.5px solid var(--input-border);color:var(--heading);">Exit Count Mode</button>`;

  appBody.innerHTML = html;

  if (!isService){
    const valEl = document.getElementById('countValue');
    const directEl = document.getElementById('countDirect');
    const pushStock = async (v)=>{
      item.stock = v;
      valEl.textContent = v; directEl.value = v;
      await sb.from('drift_products').update({ stock: v }).eq('id', item.id);
    };
    document.getElementById('countMinus').addEventListener('click', ()=> pushStock(Math.max(0, item.stock - 1)));
    document.getElementById('countPlus').addEventListener('click', ()=> pushStock(item.stock + 1));
    directEl.addEventListener('change', ()=>{
      const v = parseInt(directEl.value, 10);
      if (!isNaN(v) && v >= 0) pushStock(v);
    });
  }

  document.getElementById('countPrev').addEventListener('click', ()=>{ state.countIndex--; renderCountMode(); });
  document.getElementById('countNext').addEventListener('click', ()=>{
    if (state.countIndex === flat.length - 1) finishCount();
    else { state.countIndex++; renderCountMode(); }
  });
  document.getElementById('exitCount').addEventListener('click', finishCount);
}

function finishCount(){
  state.countMode = false;
  const low = [];
  Object.values(CATALOG).forEach(cat => cat.items.forEach(item=>{
    if (item.stock !== null && item.stock <= LOW_STOCK_THRESHOLD) low.push(item.n);
  }));
  showToast(low.length ? `Count saved — low: ${low.join(', ')}` : 'Count saved — all stocked up');
  render();
}

tabs.forEach(t=>{
  t.addEventListener('click', ()=>{ state.tab = t.dataset.tab; render(); });
});

const pinBackdrop = document.getElementById('pinBackdrop');
const pinInput = document.getElementById('pinInput');
const pinEmail = document.getElementById('pinEmail');
const pinError = document.getElementById('pinError');
const pinDots = document.getElementById('pinDots');
let ownerEmail = null;
let currentAuthUserId = null; // set regardless of owner/staff/customer mode

function renderPinDots(){
  const len = pinInput.value.length;
  const shown = Math.max(len, 6);
  pinDots.innerHTML = Array.from({length: shown}, (_,i)=>
    `<span class="${i < len ? 'dot-filled' : 'dot-empty'}"></span>`
  ).join('');
}

document.getElementById('keypadGrid').addEventListener('click', (e)=>{
  const btn = e.target.closest('.keypad-btn');
  if (!btn) return;
  const key = btn.dataset.key;
  if (key === 'clear') pinInput.value = '';
  else if (key === 'back') pinInput.value = pinInput.value.slice(0, -1);
  else if (pinInput.value.length < 12) pinInput.value += key;
  pinError.textContent = '';
  renderPinDots();
});

let logoTapCount = 0;
let logoTapTimer = null;
document.getElementById('wordmarkTap').addEventListener('click', async ()=>{
  if (state.ownerMode || state.staffMode){
    if (liveTrackingWatchId){ navigator.geolocation.clearWatch(liveTrackingWatchId); liveTrackingWatchId = null; }
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.ownerMode = false;
    state.staffMode = false;
    state.showSettings = false;
    if (state.tab === 'manage' || state.tab === 'orders') state.tab = 'shop';
    render();
    return;
  }
  logoTapCount++;
  if (logoTapTimer) clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, 2500);
  if (logoTapCount >= 5){
    logoTapCount = 0;
    pinEmail.value = '';
    pinInput.value = '';
    pinError.textContent = '';
    renderPinDots();
    pinBackdrop.classList.add('open');
    setTimeout(()=> pinEmail.focus(), 50);
  }
});

document.getElementById('pinCancel').addEventListener('click', ()=>{
  pinBackdrop.classList.remove('open');
});

async function trySignIn(){
  const email = pinEmail.value.trim();
  const password = pinInput.value;
  pinError.textContent = '';
  const { data, error } = await manualSignInWithPassword(email, password);
  if (error){
    pinError.textContent = error.message;
    return;
  }
  if (data.user.email === OWNER_EMAIL){
    pinBackdrop.classList.remove('open');
    ownerEmail = data.user.email;
    currentAuthUserId = data.user.id;
    state.ownerMode = true;
    state.tab = 'manage';
    await fetchProductInternal();
    showToast('Signed in as ' + ownerEmail);
    render();
    return;
  }
  // Not the owner — check if this account is registered crew.
  await onCustomerSignedIn(data.user);
  if (state.staffMode){
    pinBackdrop.classList.remove('open');
    state.tab = 'orders';
    showToast('Signed in as crew — ' + data.user.email);
    render();
  } else {
    pinError.textContent = 'This account isn\u2019t staff or owner.';
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.customerId = null;
    state.customerEmail = null;
    state.loyaltyPoints = 0;
    state.isDualApp = false;
    state.subscription = null;
  }
}
document.getElementById('pinSubmit').addEventListener('click', trySignIn);
pinInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') trySignIn(); });

document.addEventListener('click', (e)=>{
  if (e.target && e.target.id === 'resetOrder'){
    stopCustomerLocationSharing();
    state.cart = [];
    state.delivery = null;
    persistCart();
    render();
  }
  if (e.target && e.target.id === 'cancelActiveOrderBtn'){
    if (confirm('Cancel this order?')){
      cancelOrder(state.delivery.dbId).then(()=>{ state.delivery = null; render(); });
    }
  }
  if (e.target && e.target.id === 'editActiveOrderBtn'){
    startEditingOrder(state.delivery.dbId, state.delivery.items);
  }
});

// ============================================================
// DATA LOADING + REALTIME
// ============================================================
async function fetchProducts(){
  const { data, error } = await sb.from('drift_products').select('*').order('created_at');
  if (error) throw error;
  const grouped = {};
  Object.keys(CATEGORY_META).forEach(k => grouped[k] = { ...CATEGORY_META[k], items: [] });
  (data || []).forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = { label:p.category, emoji:'📦', desc:'', items:[] };
    const images = (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []);
    grouped[p.category].items.push({ id:p.id, n:p.name, p:Number(p.price), stock: p.stock === null ? null : Number(p.stock), cost:null, pointsValue:null, image:images[0] || null, images, swatch:p.swatch_hex });
  });
  CATALOG = grouped;
  if (state.ownerMode) await fetchProductInternal();
}

// Owner-only. Returns nothing (empty result) for anyone else — RLS
// enforces that, this isn't just a UI-level check.
async function fetchProductInternal(){
  const { data, error } = await sb.from('drift_product_internal').select('*');
  if (error || !data) return;
  const byId = {};
  data.forEach(row => byId[row.product_id] = row);
  Object.values(CATALOG).forEach(cat => cat.items.forEach(item=>{
    const row = byId[item.id];
    if (row){ item.cost = row.cost != null ? Number(row.cost) : null; item.pointsValue = row.points_value; }
  }));
}

async function fetchBoatStatus(){
  const { data, error } = await sb.from('drift_boat_status').select('*').eq('id', 1).single();
  if (error) throw error;
  BOAT = data;
}

async function fetchHotBiteFeed(){
  const { data, error } = await sb.from('drift_hot_bite_feed').select('*').order('logged_at', { ascending:false }).limit(30);
  if (error) throw error;
  HOT_BITE_FEED = data || [];
}

function subscribeRealtime(){
  sb.channel('drift_boat_status_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_boat_status' }, payload => {
      BOAT = payload.new;
      if (state.tab === 'track') updateTrackLiveText();
    }).subscribe();

  sb.channel('drift_products_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_products' }, async () => {
      await fetchProducts();
      if (state.tab === 'shop' || state.tab === 'manage') render();
    }).subscribe();

  sb.channel('drift_catches_ch')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'drift_catches' }, payload => {
      HOT_BITE_FEED = [{ species:payload.new.species, bait:payload.new.bait, spot:payload.new.spot, logged_at:payload.new.logged_at, source:'drift' }, ...HOT_BITE_FEED];
      if (state.tab === 'fish') render();
    }).subscribe();

  sb.channel('drift_loyalty_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_loyalty' }, payload => {
      if (state.customerId && payload.new && payload.new.user_id === state.customerId){
        const before = state.loyaltyPoints;
        state.loyaltyPoints = payload.new.points;
        if (state.loyaltyPoints > before) showToast(`+${state.loyaltyPoints - before} points earned!`);
        if (state.tab === 'account') render();
      }
    }).subscribe();

  sb.channel('drift_redemptions_ch')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'drift_redemptions' }, payload => {
      if (state.customerId && payload.new && payload.new.user_id === state.customerId && payload.new.status === 'used'){
        MY_REDEMPTIONS = MY_REDEMPTIONS.filter(r => r.id !== payload.new.id);
        if (state.tab === 'account') render();
      }
    }).subscribe();

  sb.channel('drift_settings_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_settings' }, payload => {
      SETTINGS = payload.new;
      const free = TIERS.find(t => t.id === 'free');
      if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
      render();
    }).subscribe();

  // Powers BOTH the customer's own delivery tracker (if this update is
  // their active order) and the staff/owner Orders queue.
  sb.channel('drift_orders_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_orders' }, payload => {
      if (state.delivery && payload.new && payload.new.id === state.delivery.dbId){
        const statusChanged = payload.new.status !== state.delivery.status;
        state.delivery.status = payload.new.status;
        if (statusChanged) notifyOrderStatus(payload.new.status);
        if (payload.new.status === 'delivered' || payload.new.status === 'canceled'){
          stopCustomerLocationSharing();
        }
        if (state.tab === 'shop') render();
      }
      if (state.ownerMode || state.staffMode){
        if (payload.eventType === 'INSERT') alertNewOrder();
        fetchActiveOrders().then(render);
      }
    }).subscribe();
}

// A short beep (generated, not a loaded file) plus a vibration where
// supported — vibration is Android-only, iOS Safari doesn't implement
// the Vibration API at all, so this quietly no-ops there.
function alertNewOrder(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

async function fetchActiveOrders(){
  const { data, error } = await sb.from('drift_orders').select('*').neq('status','delivered').order('created_at', { ascending:true });
  if (!error) ACTIVE_ORDERS = data || [];
}

// Angr catches aren't realtime-covered (view limitation) — poll occasionally
// so new Angr catches still show up without a manual refresh.
setInterval(()=>{ if (state.tab === 'fish') fetchHotBiteFeed().then(()=>{ if (state.tab==='fish') render(); }); }, 25000);

const OWNER_EMAIL = 'bmp.clouded@gmail.com';

async function init(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      if (session.user.email === OWNER_EMAIL){
        state.ownerMode = true;
        ownerEmail = session.user.email;
        currentAuthUserId = session.user.id;
      } else {
        await onCustomerSignedIn(session.user);
      }
    }
  } catch(e){}

  loadLocalPrefs();

  const results = await Promise.allSettled([fetchProducts(), fetchBoatStatus(), fetchHotBiteFeed(), fetchSettings(), fetchRewards()]);
  const failed = results.filter(r => r.status === 'rejected');
  if (failed.length){
    showFatalError('Could not load: ' + failed.map(f => f.reason && f.reason.message ? f.reason.message : f.reason).join(' — '));
    return;
  }
  if (state.ownerMode || state.staffMode) await fetchActiveOrders();

  state.loading = false;
  render();
  subscribeRealtime();
  fetchWeather();

  sb.auth.onAuthStateChange((_event, session) => {
    if (!session){
      state.ownerMode = false;
      state.staffMode = false;
      ownerEmail = null;
      state.customerId = null;
      state.customerEmail = null;
      state.loyaltyPoints = 0;
      state.isDualApp = false;
      state.subscription = null;
      if (state.tab === 'manage' || state.tab === 'orders') state.tab = 'shop';
      render();
    }
  });
}

if (sb) init();
</script>
