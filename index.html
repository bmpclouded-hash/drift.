  });
  html += `</div>

    <div class="section-title" style="margin-top:20px;">Inventory</div>
    <div class="section-note">${lowItems.length
      ? `${lowItems.length} item${lowItems.length>1?'s':''} running low: ${lowItems.map(i=>i.n).join(', ')}.`
      : 'Everything is stocked above the low-stock line.'}</div>
    <button class="advance-btn" id="startCountBtn" style="background:var(--teal);">📋 Start Inventory Count</button>

    <div class="section-title" style="margin-top:20px;">Manage Products</div>
    <div class="section-note">Pick a category, ${state.ownerMode ? 'edit price or stock, remove items, or add something new' : 'adjust stock as you sell or restock (pricing is owner-only)'}.</div>
    <div class="cat-grid">`;
  Object.entries(CATALOG).forEach(([key,cat])=>{
    html += `<button class="cat-card ${state.manageCat===key?'active':''}" data-mcat="${key}">
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-desc">${cat.items.length} item${cat.items.length===1?'':'s'}</div>
    </button>`;
  });
  html += `</div>`;

  (CATALOG[state.manageCat] ? CATALOG[state.manageCat].items : []).forEach((item, i)=>{
    const editing = state.editingIndex === i;
    const isService = item.stock === null;
    const low = !isService && item.stock <= LOW_STOCK_THRESHOLD;
    const margin = (state.ownerMode && item.cost != null) ? (item.p - item.cost) : null;
    const marginPct = (margin != null && item.p > 0) ? Math.round((margin / item.p) * 100) : null;
    html += `<div class="manage-item">
      <div>
        ${(item.images && item.images.length) ? `<div class="manage-photo-strip">${item.images.map((img,imgIdx)=>`
          <div class="manage-photo-wrap">
            <img class="manage-thumb" src="${img}" alt="${item.n}" data-manage-lightbox="${i}:${imgIdx}">
            ${(editing && state.ownerMode) ? `<button class="manage-photo-remove" data-remove-image="${item.id}" data-image-index="${imgIdx}">✕</button>` : ''}
          </div>`).join('')}</div>` : ''}
        <div class="m-name">${item.swatch ? `<span class="color-swatch" style="background:${item.swatch};"></span> ` : ''}${item.n}</div>
        ${editing
          ? `<div class="m-price-view">${state.ownerMode ? `$ <input type="number" step="0.5" id="editPrice" value="${item.p}">` : `$${item.p.toFixed(2)} (fixed)`}
              ${isService ? '' : `stock <input type="number" step="1" class="stock-input" id="editStock" value="${item.stock}">`}
            </div>
            ${state.ownerMode ? `<div class="hidden-value-row">
                <label>Cost $ <input type="number" step="0.01" class="hidden-value-input" id="editCost" value="${item.cost != null ? item.cost : ''}" placeholder="—"></label>
                <label>Points <input type="number" step="1" class="hidden-value-input" id="editPointsValue" value="${item.pointsValue != null ? item.pointsValue : ''}" placeholder="auto"></label>
              </div>
              <div class="hidden-value-hint">Not shown to customers or crew — cost is for your own margin tracking, points overrides the default $1-per-point.</div>
              <div class="image-upload-row">
                <input type="file" accept="image/*" multiple id="editImageFile" data-product-id="${item.id}">
                <div class="image-upload-hint">Add one or more photos — they'll all show in the gallery customers can tap through.</div>
              </div>
              <div class="image-upload-row">
                <label style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#6C7A73;">
                  Color swatch <input type="color" id="editSwatch" value="${item.swatch || '#0B3A63'}" style="width:32px;height:24px;border:none;padding:0;cursor:pointer;">
                  ${item.swatch ? `<button type="button" id="clearSwatchBtn" style="background:none;border:none;color:var(--coral);font-size:11px;cursor:pointer;">Clear</button>` : ''}
                </label>
                <div class="image-upload-hint">Shows as a small dot next to the name — useful for listing color variants (e.g. "Drift Tee — Navy") without a separate photo per color.</div>
              </div>` : ''}`
          : `<div class="m-price-view">$${item.p.toFixed(2)}</div>
             <div class="m-stock-view ${low?'low':''}">${isService ? 'Unlimited (service)' : `${item.stock} in stock`}</div>
             ${margin != null ? `<div class="margin-view">Margin: $${margin.toFixed(2)} (${marginPct}%)${item.pointsValue != null ? ` · ${item.pointsValue} pts/unit` : ''}</div>` : ''}`
        }
      </div>
      <div class="m-actions">
        ${editing
          ? `<button class="m-btn save" data-save="${i}">✓</button>`
          : `<button class="m-btn edit" data-edit="${i}">✎</button>`
        }
        ${state.ownerMode ? `<button class="m-btn del" data-del="${i}">✕</button>` : ''}
      </div>
    </div>`;
  });

  if (state.ownerMode){
    html += `
    <div class="add-product-form">
      <label>Product name</label>
      <input type="text" id="newProdName" placeholder="e.g. Dockside Cold Brew">
      <label>Price ($)</label>
      <input type="number" step="0.5" id="newProdPrice" placeholder="0.00">
      <label>Starting stock (leave blank for unlimited / service item)</label>
      <input type="number" step="1" id="newProdStock" placeholder="e.g. 20">
      <label>Photo (optional)</label>
      <input type="file" accept="image/*" multiple id="newProdImage">
      <button class="add-submit" id="addProdBtn">Add to ${CATALOG[state.manageCat] ? CATALOG[state.manageCat].label : ''}</button>
    </div>
    <button class="advance-btn" id="openSettingsBtn" style="margin-top:20px;">⚙ Settings</button>`;
  }
  html += `<button class="hail-btn" id="exitOwnerBtn" style="margin-top:12px;background:none;border:1.5px solid #DCE3E6;color:var(--navy);">Sign Out</button>`;

  appBody.innerHTML = html;

  const openSettingsBtn = appBody.querySelector('#openSettingsBtn');
  if (openSettingsBtn) openSettingsBtn.addEventListener('click', ()=>{ state.showSettings = true; render(); });

  const exitOwnerBtn = appBody.querySelector('#exitOwnerBtn');
  if (exitOwnerBtn) exitOwnerBtn.addEventListener('click', async ()=>{
    if (liveTrackingWatchId){ navigator.geolocation.clearWatch(liveTrackingWatchId); liveTrackingWatchId = null; }
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.ownerMode = false;
    state.staffMode = false;
    state.showSettings = false;
    state.tab = 'shop';
    render();
  });

  const liveTrackBtn = appBody.querySelector('#liveTrackBtn');
  if (liveTrackBtn) liveTrackBtn.addEventListener('click', ()=>{
    if (liveTrackingWatchId){
      navigator.geolocation.clearWatch(liveTrackingWatchId);
      liveTrackingWatchId = null;
      showToast('Live tracking stopped');
      renderManage();
      return;
    }
    if (!navigator.geolocation){ showToast('GPS not available on this device'); return; }
    liveTrackingWatchId = navigator.geolocation.watchPosition(
      async (pos)=>{
        const { data, error } = await sb.from('drift_boat_status').update({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          current_stop_name: null,
          updated_at: new Date().toISOString()
        }).eq('id', 1).select().single();
        if (!error && data) BOAT = data;
      },
      (err)=>{ showToast('GPS error: ' + err.message); },
      { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
    );
    showToast('Live tracking started — your real position now updates for everyone');
    renderManage();
  });

  appBody.querySelectorAll('[data-jump]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const stop = ROUTE.find(s=>s.name===btn.dataset.jump);
      if (!stop) return;
      const { data, error } = await sb.from('drift_boat_status').update({
        lat: stop.lat, lng: stop.lng, current_stop_name: stop.name, updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();
      if (!error && data){ BOAT = data; showToast(`Now at ${stop.name}`); render(); }
    });
  });

  const startCountBtn = appBody.querySelector('#startCountBtn');
  if (startCountBtn) startCountBtn.addEventListener('click', ()=>{
    state.countMode = true;
    state.countIndex = 0;
    render();
  });

  appBody.querySelectorAll('[data-mcat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.manageCat = btn.dataset.mcat; state.editingIndex = null; render(); });
  });
  appBody.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editingIndex = Number(btn.dataset.edit); render(); });
  });
  appBody.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = Number(btn.dataset.save);
      const item = CATALOG[state.manageCat].items[i];
      const updates = {};
      const priceEl = document.getElementById('editPrice');
      if (priceEl){
        const val = parseFloat(priceEl.value);
        if (!isNaN(val) && val >= 0) updates.price = val;
      }
      const stockEl = document.getElementById('editStock');
      if (stockEl){
        const sval = parseInt(stockEl.value, 10);
        if (!isNaN(sval) && sval >= 0) updates.stock = sval;
      }
      const swatchEl = document.getElementById('editSwatch');
      if (swatchEl) updates.swatch_hex = swatchEl.value;
      const { data, error } = await sb.from('drift_products').update(updates).eq('id', item.id).select().single();
      if (error){ showToast(error.message.includes('owner') ? 'Only the owner can change prices' : 'Update failed — are you still signed in?'); return; }
      if (updates.price !== undefined) item.p = data.price;
      if (updates.stock !== undefined) item.stock = data.stock;
      if (updates.swatch_hex !== undefined) item.swatch = data.swatch_hex;

      const costEl = document.getElementById('editCost');
      const pointsEl = document.getElementById('editPointsValue');
      if (costEl || pointsEl){
        const costVal = costEl && costEl.value !== '' ? parseFloat(costEl.value) : null;
        const pointsVal = pointsEl && pointsEl.value !== '' ? parseInt(pointsEl.value, 10) : null;
        const { error: intErr } = await sb.from('drift_product_internal')
          .upsert({ product_id: item.id, cost: costVal, points_value: pointsVal, updated_at: new Date().toISOString() });
        if (!intErr){ item.cost = costVal; item.pointsValue = pointsVal; }
      }

      state.editingIndex = null;
      showToast('Product updated');
      render();
    });
  });

  const imageFileInput = appBody.querySelector('#editImageFile');
  if (imageFileInput) imageFileInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const productId = imageFileInput.dataset.productId;
    const item = Object.values(CATALOG).flatMap(c=>c.items).find(p=>p.id===productId);
    const newUrls = [];
    for (const file of files){
      if (file.size > 5 * 1024 * 1024){ showToast(`Skipped ${file.name} — over 5MB`); continue; }
      showToast(`Uploading ${file.name}…`);
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${productId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: uploadErr } = await sb.storage.from('product-images').upload(path, file, { upsert: true });
      if (uploadErr){ showToast(`Upload failed for ${file.name}`); continue; }
      const { data: urlData } = sb.storage.from('product-images').getPublicUrl(path);
      newUrls.push(urlData.publicUrl);
    }
    if (!newUrls.length) return;
    const combined = [...(item && item.images ? item.images : []), ...newUrls];
    const { error: updateErr } = await sb.from('drift_products').update({ image_urls: combined, image_url: combined[0] }).eq('id', productId);
    if (updateErr){ showToast('Could not save photos — are you still signed in?'); return; }
    if (item){ item.images = combined; item.image = combined[0]; }
    showToast(`Added ${newUrls.length} photo${newUrls.length>1?'s':''}`);
    render();
  });

  appBody.querySelectorAll('[data-remove-image]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const productId = btn.dataset.removeImage;
      const imgIdx = Number(btn.dataset.imageIndex);
      const item = Object.values(CATALOG).flatMap(c=>c.items).find(p=>p.id===productId);
      if (!item || !item.images) return;
      const updated = item.images.filter((_,idx)=>idx!==imgIdx);
      const { error } = await sb.from('drift_products').update({ image_urls: updated, image_url: updated[0] || null }).eq('id', productId);
      if (error){ showToast('Could not remove photo'); return; }
      item.images = updated;
      item.image = updated[0] || null;
      showToast('Photo removed');
      render();
    });
  });

  appBody.querySelectorAll('[data-manage-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const [itemIdx, imgIdx] = img.dataset.manageLightbox.split(':').map(Number);
      const item = CATALOG[state.manageCat].items[itemIdx];
      if (item && item.images && item.images.length) openLightbox(item.images, imgIdx);
    });
  });

  const clearSwatchBtn = appBody.querySelector('#clearSwatchBtn');
  if (clearSwatchBtn) clearSwatchBtn.addEventListener('click', async ()=>{
    const item = CATALOG[state.manageCat].items[state.editingIndex];
    const { error } = await sb.from('drift_products').update({ swatch_hex: null }).eq('id', item.id);
    if (error){ showToast('Could not clear swatch'); return; }
    item.swatch = null;
    showToast('Swatch cleared');
    render();
  });

  appBody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = Number(btn.dataset.del);
      const item = CATALOG[state.manageCat].items[i];
      if (!confirm(`Remove "${item.n}" from the menu?`)) return;
      const { error } = await sb.from('drift_products').delete().eq('id', item.id);
      if (error){ showToast('Delete failed — are you still signed in?'); return; }
      CATALOG[state.manageCat].items.splice(i, 1);
      state.editingIndex = null;
      showToast('Product removed');
      render();
    });
  });
  const addBtn = appBody.querySelector('#addProdBtn');
  if (addBtn) addBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('newProdName').value.trim();
    const price = parseFloat(document.getElementById('newProdPrice').value);
    const stockRaw = document.getElementById('newProdStock').value;
    const stock = stockRaw === '' ? null : parseInt(stockRaw, 10);
    const imageFiles = Array.from(document.getElementById('newProdImage').files || []);
    if (!name || isNaN(price) || price < 0) return;
    const { data, error } = await sb.from('drift_products').insert({
      category: state.manageCat, name, price, stock: (stock === null || isNaN(stock)) ? null : stock
    }).select().single();
    if (error){ showToast('Add failed — are you still signed in?'); return; }

    const imageUrls = [];
    for (const file of imageFiles){
      if (file.size > 5 * 1024 * 1024){ showToast(`Skipped ${file.name} — over 5MB`); continue; }
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${data.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: uploadErr } = await sb.storage.from('product-images').upload(path, file, { upsert: true });
      if (uploadErr) continue;
      const { data: urlData } = sb.storage.from('product-images').getPublicUrl(path);
      imageUrls.push(urlData.publicUrl);
    }
    if (imageUrls.length){
      await sb.from('drift_products').update({ image_urls: imageUrls, image_url: imageUrls[0] }).eq('id', data.id);
    }

    CATALOG[state.manageCat].items.push({ id:data.id, n:data.name, p:Number(data.price), stock:data.stock, image:imageUrls[0] || null, images:imageUrls });
    showToast(`Added ${name}${imageUrls.length ? ` with ${imageUrls.length} photo${imageUrls.length>1?'s':''}` : ''}`);
    document.getElementById('newProdName').value = '';
    document.getElementById('newProdPrice').value = '';
    document.getElementById('newProdStock').value = '';
    document.getElementById('newProdImage').value = '';
    render();
  });
}

function renderSettings(){
  let html = `
    <div class="manage-banner">Settings — owner only.</div>
    <div class="section-title" style="font-size:16px;">Customer Experience</div>
    <div class="settings-section">
      <label>Announcement banner (shown to every customer, leave blank to hide)</label>
      <textarea id="setAnnouncement" rows="2" placeholder="e.g. Closed today for weather">${SETTINGS.announcement || ''}</textarea>
      <label>Free-tier phone-confirmation threshold ($)</label>
      <input type="number" id="setThreshold" value="${SETTINGS.confirm_threshold_base}">
      <button class="add-submit" id="saveSettingsBtn" style="margin-top:12px;">Save Settings</button>
    </div>

    <div class="section-title" style="font-size:16px;">Crew Accounts</div>
    <div class="section-note">Add an email as staff before or after they create a Drift/Angr account — the moment that email signs in, they get crew access automatically.</div>
    <div class="settings-section" id="staffList">Loading staff…</div>
    <div class="settings-section">
      <label>Add crew member by email</label>
      <input type="email" id="newStaffEmail" placeholder="crew@example.com">
      <button class="add-submit" id="addStaffBtn" style="margin-top:10px;">Add Crew Member</button>
    </div>

    <button class="hail-btn" id="backToManageBtn" style="margin-top:10px;background:none;border:1.5px solid #DCE3E6;color:var(--navy);">← Back to Manage</button>`;

  appBody.innerHTML = html;

  document.getElementById('backToManageBtn').addEventListener('click', ()=>{ state.showSettings = false; render(); });

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const announcement = document.getElementById('setAnnouncement').value.trim();
    const threshold = parseInt(document.getElementById('setThreshold').value, 10);
    const { data, error } = await sb.from('drift_settings').update({
      announcement: announcement || null,
      confirm_threshold_base: isNaN(threshold) ? SETTINGS.confirm_threshold_base : threshold,
      updated_at: new Date().toISOString()
    }).eq('id', 1).select().single();
    if (error){ showToast('Could not save settings'); return; }
    SETTINGS = data;
    const free = TIERS.find(t => t.id === 'free');
    if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
    showToast('Settings saved');
    render();
  });

  loadStaffList();

  document.getElementById('addStaffBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('newStaffEmail').value.trim().toLowerCase();
    if (!email || !email.includes('@')) return;
    const { error } = await sb.from('drift_staff').insert({ email });
    if (error){ showToast('Could not add — already added?'); return; }
    document.getElementById('newStaffEmail').value = '';
    showToast(`Added ${email} as crew`);
    loadStaffList();
  });
}

async function loadStaffList(){
  const { data, error } = await sb.from('drift_staff').select('*').order('added_at');
  const el = document.getElementById('staffList');
  if (!el) return;
  if (error){ el.innerHTML = 'Could not load staff list.'; return; }
  if (!data.length){ el.innerHTML = '<div class="section-note" style="margin:0;">No crew added yet.</div>'; return; }
  el.innerHTML = data.map(s => `
    <div class="staff-row">
      <span>${s.email}</span>
      <button class="staff-remove" data-removestaff="${s.email}">✕</button>
    </div>`).join('');
  el.querySelectorAll('[data-removestaff]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await sb.from('drift_staff').delete().eq('email', btn.dataset.removestaff);
      showToast('Crew member removed');
      loadStaffList();
    });
  });
}

function flatItems(){
  const flat = [];
  Object.entries(CATALOG).forEach(([cat, data])=>{
    data.items.forEach((item, idx)=> flat.push({cat, idx, item}));
  });
  return flat;
}

function renderCountMode(){
  const flat = flatItems();
  if (!flat.length){ state.countMode = false; renderManage(); return; }
  if (state.countIndex >= flat.length) state.countIndex = flat.length - 1;
  const entry = flat[state.countIndex];
  const item = entry.item;
  const isService = item.stock === null;

  let html = `
    <div class="manage-banner">Inventory Count — item ${state.countIndex+1} of ${flat.length}</div>
    <div class="count-card">
      <div class="count-cat">${CATALOG[entry.cat].label}</div>
      <div class="count-name">${item.n}</div>
      ${isService
        ? `<div class="count-service-note">This is a service item (unlimited) — nothing to count.</div>`
        : `<div class="count-stepper">
            <button class="count-btn" id="countMinus">−</button>
            <div class="count-value" id="countValue">${item.stock}</div>
            <button class="count-btn" id="countPlus">+</button>
          </div>
          <input type="number" class="count-direct" id="countDirect" value="${item.stock}">`
      }
    </div>
    <div class="count-nav">
      <button class="count-nav-btn" id="countPrev" ${state.countIndex===0?'disabled':''}>← Prev</button>
      <button class="count-nav-btn primary" id="countNext">${state.countIndex === flat.length-1 ? 'Finish Count' : 'Next →'}</button>
    </div>
    <button class="hail-btn" id="exitCount" style="margin-top:14px;background:none;border:1.5px solid #DCE3E6;color:var(--navy);">Exit Count Mode</button>`;

  appBody.innerHTML = html;

  if (!isService){
    const valEl = document.getElementById('countValue');
    const directEl = document.getElementById('countDirect');
    const pushStock = async (v)=>{
      item.stock = v;
      valEl.textContent = v; directEl.value = v;
      await sb.from('drift_products').update({ stock: v }).eq('id', item.id);
    };
    document.getElementById('countMinus').addEventListener('click', ()=> pushStock(Math.max(0, item.stock - 1)));
    document.getElementById('countPlus').addEventListener('click', ()=> pushStock(item.stock + 1));
    directEl.addEventListener('change', ()=>{
      const v = parseInt(directEl.value, 10);
      if (!isNaN(v) && v >= 0) pushStock(v);
    });
  }

  document.getElementById('countPrev').addEventListener('click', ()=>{ state.countIndex--; renderCountMode(); });
  document.getElementById('countNext').addEventListener('click', ()=>{
    if (state.countIndex === flat.length - 1) finishCount();
    else { state.countIndex++; renderCountMode(); }
  });
  document.getElementById('exitCount').addEventListener('click', finishCount);
}

function finishCount(){
  state.countMode = false;
  const low = [];
  Object.values(CATALOG).forEach(cat => cat.items.forEach(item=>{
    if (item.stock !== null && item.stock <= LOW_STOCK_THRESHOLD) low.push(item.n);
  }));
  showToast(low.length ? `Count saved — low: ${low.join(', ')}` : 'Count saved — all stocked up');
  render();
}

tabs.forEach(t=>{
  t.addEventListener('click', ()=>{ state.tab = t.dataset.tab; render(); });
});

const pinBackdrop = document.getElementById('pinBackdrop');
const pinInput = document.getElementById('pinInput');
const pinEmail = document.getElementById('pinEmail');
const pinError = document.getElementById('pinError');
const pinDots = document.getElementById('pinDots');
let ownerEmail = null;
let currentAuthUserId = null; // set regardless of owner/staff/customer mode

function renderPinDots(){
  const len = pinInput.value.length;
  const shown = Math.max(len, 6);
  pinDots.innerHTML = Array.from({length: shown}, (_,i)=>
    `<span class="${i < len ? 'dot-filled' : 'dot-empty'}"></span>`
  ).join('');
}

document.getElementById('keypadGrid').addEventListener('click', (e)=>{
  const btn = e.target.closest('.keypad-btn');
  if (!btn) return;
  const key = btn.dataset.key;
  if (key === 'clear') pinInput.value = '';
  else if (key === 'back') pinInput.value = pinInput.value.slice(0, -1);
  else if (pinInput.value.length < 12) pinInput.value += key;
  pinError.textContent = '';
  renderPinDots();
});

let logoTapCount = 0;
let logoTapTimer = null;
document.getElementById('wordmarkTap').addEventListener('click', async ()=>{
  if (state.ownerMode || state.staffMode){
    if (liveTrackingWatchId){ navigator.geolocation.clearWatch(liveTrackingWatchId); liveTrackingWatchId = null; }
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.ownerMode = false;
    state.staffMode = false;
    state.showSettings = false;
    if (state.tab === 'manage' || state.tab === 'orders') state.tab = 'shop';
    render();
    return;
  }
  logoTapCount++;
  if (logoTapTimer) clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, 2500);
  if (logoTapCount >= 5){
    logoTapCount = 0;
    pinEmail.value = '';
    pinInput.value = '';
    pinError.textContent = '';
    renderPinDots();
    pinBackdrop.classList.add('open');
    setTimeout(()=> pinEmail.focus(), 50);
  }
});

document.getElementById('pinCancel').addEventListener('click', ()=>{
  pinBackdrop.classList.remove('open');
});

async function trySignIn(){
  const email = pinEmail.value.trim();
  const password = pinInput.value;
  pinError.textContent = '';
  const { data, error } = await manualSignInWithPassword(email, password);
  if (error){
    pinError.textContent = error.message;
    return;
  }
  if (data.user.email === OWNER_EMAIL){
    pinBackdrop.classList.remove('open');
    ownerEmail = data.user.email;
    currentAuthUserId = data.user.id;
    state.ownerMode = true;
    state.tab = 'manage';
    await fetchProductInternal();
    showToast('Signed in as ' + ownerEmail);
    render();
    return;
  }
  // Not the owner — check if this account is registered crew.
  await onCustomerSignedIn(data.user);
  if (state.staffMode){
    pinBackdrop.classList.remove('open');
    state.tab = 'orders';
    showToast('Signed in as crew — ' + data.user.email);
    render();
  } else {
    pinError.textContent = 'This account isn\u2019t staff or owner.';
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.customerId = null;
    state.customerEmail = null;
    state.loyaltyPoints = 0;
    state.isDualApp = false;
    state.subscription = null;
  }
}
document.getElementById('pinSubmit').addEventListener('click', trySignIn);
pinInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') trySignIn(); });

document.addEventListener('click', (e)=>{
  if (e.target && e.target.id === 'resetOrder'){
    state.cart = [];
    state.delivery = null;
    persistCart();
    render();
  }
});

// ============================================================
// DATA LOADING + REALTIME
// ============================================================
async function fetchProducts(){
  const { data, error } = await sb.from('drift_products').select('*').order('created_at');
  if (error) throw error;
  const grouped = {};
  Object.keys(CATEGORY_META).forEach(k => grouped[k] = { ...CATEGORY_META[k], items: [] });
  (data || []).forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = { label:p.category, emoji:'📦', desc:'', items:[] };
    const images = (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []);
    grouped[p.category].items.push({ id:p.id, n:p.name, p:Number(p.price), stock: p.stock === null ? null : Number(p.stock), cost:null, pointsValue:null, image:images[0] || null, images, swatch:p.swatch_hex });
  });
  CATALOG = grouped;
  if (state.ownerMode) await fetchProductInternal();
}

// Owner-only. Returns nothing (empty result) for anyone else — RLS
// enforces that, this isn't just a UI-level check.
async function fetchProductInternal(){
  const { data, error } = await sb.from('drift_product_internal').select('*');
  if (error || !data) return;
  const byId = {};
  data.forEach(row => byId[row.product_id] = row);
  Object.values(CATALOG).forEach(cat => cat.items.forEach(item=>{
    const row = byId[item.id];
    if (row){ item.cost = row.cost != null ? Number(row.cost) : null; item.pointsValue = row.points_value; }
  }));
}

async function fetchBoatStatus(){
  const { data, error } = await sb.from('drift_boat_status').select('*').eq('id', 1).single();
  if (error) throw error;
  BOAT = data;
}

async function fetchHotBiteFeed(){
  const { data, error } = await sb.from('drift_hot_bite_feed').select('*').order('logged_at', { ascending:false }).limit(30);
  if (error) throw error;
  HOT_BITE_FEED = data || [];
}

function subscribeRealtime(){
  sb.channel('drift_boat_status_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_boat_status' }, payload => {
      BOAT = payload.new;
      if (state.tab === 'track') updateTrackLiveText();
    }).subscribe();

  sb.channel('drift_products_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_products' }, async () => {
      await fetchProducts();
      if (state.tab === 'shop' || state.tab === 'manage') render();
    }).subscribe();

  sb.channel('drift_catches_ch')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'drift_catches' }, payload => {
      HOT_BITE_FEED = [{ species:payload.new.species, bait:payload.new.bait, spot:payload.new.spot, logged_at:payload.new.logged_at, source:'drift' }, ...HOT_BITE_FEED];
      if (state.tab === 'fish') render();
    }).subscribe();

  sb.channel('drift_loyalty_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_loyalty' }, payload => {
      if (state.customerId && payload.new && payload.new.user_id === state.customerId){
        const before = state.loyaltyPoints;
        state.loyaltyPoints = payload.new.points;
        if (state.loyaltyPoints > before) showToast(`+${state.loyaltyPoints - before} points earned!`);
        if (state.tab === 'account') render();
      }
    }).subscribe();

  sb.channel('drift_redemptions_ch')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'drift_redemptions' }, payload => {
      if (state.customerId && payload.new && payload.new.user_id === state.customerId && payload.new.status === 'used'){
        MY_REDEMPTIONS = MY_REDEMPTIONS.filter(r => r.id !== payload.new.id);
        if (state.tab === 'account') render();
      }
    }).subscribe();

  sb.channel('drift_settings_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_settings' }, payload => {
      SETTINGS = payload.new;
      const free = TIERS.find(t => t.id === 'free');
      if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
      render();
    }).subscribe();

  // Powers BOTH the customer's own delivery tracker (if this update is
  // their active order) and the staff/owner Orders queue.
  sb.channel('drift_orders_ch')
    .on('postgres_changes', { event:'*', schema:'public', table:'drift_orders' }, payload => {
      if (state.delivery && payload.new && payload.new.id === state.delivery.dbId){
        state.delivery.status = payload.new.status;
        if (state.tab === 'shop') render();
      }
      if (state.ownerMode || state.staffMode){
        fetchActiveOrders().then(render);
      }
    }).subscribe();
}

async function fetchActiveOrders(){
  const { data, error } = await sb.from('drift_orders').select('*').neq('status','delivered').order('created_at', { ascending:true });
  if (!error) ACTIVE_ORDERS = data || [];
}

// Angr catches aren't realtime-covered (view limitation) — poll occasionally
// so new Angr catches still show up without a manual refresh.
setInterval(()=>{ if (state.tab === 'fish') fetchHotBiteFeed().then(()=>{ if (state.tab==='fish') render(); }); }, 25000);

const OWNER_EMAIL = 'bmp.clouded@gmail.com';

async function init(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      if (session.user.email === OWNER_EMAIL){
        state.ownerMode = true;
        ownerEmail = session.user.email;
        currentAuthUserId = session.user.id;
      } else {
        await onCustomerSignedIn(session.user);
      }
    }
  } catch(e){}

  loadLocalPrefs();

  const results = await Promise.allSettled([fetchProducts(), fetchBoatStatus(), fetchHotBiteFeed(), fetchSettings(), fetchRewards()]);
  const failed = results.filter(r => r.status === 'rejected');
  if (failed.length){
    showFatalError('Could not load: ' + failed.map(f => f.reason && f.reason.message ? f.reason.message : f.reason).join(' — '));
    return;
  }
  if (state.ownerMode || state.staffMode) await fetchActiveOrders();

  state.loading = false;
  render();
  subscribeRealtime();
  fetchWeather();

  sb.auth.onAuthStateChange((_event, session) => {
    if (!session){
      state.ownerMode = false;
      state.staffMode = false;
      ownerEmail = null;
      state.customerId = null;
      state.customerEmail = null;
      state.loyaltyPoints = 0;
      state.isDualApp = false;
      state.subscription = null;
      if (state.tab === 'manage' || state.tab === 'orders') state.tab = 'shop';
      render();
    }
  });
}

if (sb) init();
</script>
