<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drift — The Store That Comes to You</title>
<meta name="theme-color" content="#0B3A63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drift">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Drift%22%2C%22short_name%22%3A%22Drift%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F2F4F5%22%2C%22theme_color%22%3A%22%230B3A63%22%7D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B3A63'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2302B8C2' stroke-width='7'/%3E%3Cline x1='38' y1='58' x2='62' y2='42' stroke='%2302B8C2' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B3A63'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2302B8C2' stroke-width='7'/%3E%3Cline x1='38' y1='58' x2='62' y2='42' stroke='%2302B8C2' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --navy:#0B3A63;
  --navy-deep:#041826;
  --sand:#F2F4F5;
  --sand-dim:#E3E8EA;
  --teal:#067F87;
  --teal-deep:#0B4A50;
  --rust:#02B8C2;
  --coral:#C85C46;
  --ink:#12222E;
  --paper:#FFFFFF;
}
*{box-sizing:border-box;}
html, body{ height:100%; }
body{
  margin:0;
  font-family:'Manrope', sans-serif;
  color:var(--ink);
  background:var(--sand);
  overscroll-behavior:none;
}
.app-shell{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--sand);
  position:relative;
}

.app-header{
  background:linear-gradient(160deg, var(--navy), var(--navy-deep));
  color:var(--sand);
  padding:20px 20px 16px;
  padding-top:max(20px, env(safe-area-inset-top));
  position:relative;
  flex:none;
}
.wordmark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:8px;
}
.wordmark .mark{
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid var(--rust);
  position:relative;
  flex:none;
}
.wordmark .mark::after{
  content:'';
  position:absolute;
  top:50%; left:50%;
  width:9px;height:2px;
  background:var(--rust);
  transform:translate(-50%,-50%) rotate(35deg);
}
.app-sub{ font-size:12.5px; color:#9FB4BB; margin-top:4px; }
.wordmark{ cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }

.app-body{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--sand);
  padding:18px 18px calc(90px + env(safe-area-inset-bottom));
}

.section-title{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:2px 0 4px; color:var(--navy); }
.section-note{ font-size:12.5px; color:#6C7A73; margin:0 0 14px; }

/* ---- TRACK TAB ---- */
.map-wrap{ background:var(--paper); border-radius:20px; padding:12px; border:1px solid #E3E8EA; margin-bottom:14px; }
#trackMap{ width:100%; height:230px; border-radius:14px; z-index:0; }
.boat-marker{ font-size:22px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.stop-marker{ font-size:15px; }
.user-marker{
  width:14px; height:14px; border-radius:50%; background:var(--rust);
  border:2px solid #fff; box-shadow:0 0 0 3px rgba(2,184,194,.28);
}
.eta-card{ margin-top:12px; background:#fff; border:1px solid #E3E8EA; border-radius:14px; padding:13px 15px; }
.eta-label{ font-size:11px; color:#7A857E; font-weight:700; letter-spacing:.03em; }
.eta-value{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--navy); }
.eta-sub{ font-size:12px; color:#6C7A73; margin-top:2px; }
.hail-btn{
  width:100%; margin-top:12px; background:var(--rust); color:#fff; border:none; border-radius:10px;
  padding:12px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Manrope';
}
.hail-btn.sent{ background:var(--teal); }
.hail-hint{ text-align:center; font-size:11.5px; color:#8B978F; margin-top:8px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:11.5px; color:#556661; margin-top:10px; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:9px;height:9px;border-radius:50%;display:inline-block; }

/* ---- SHOP TAB ---- */
.cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.cat-card{ background:#fff; border:1px solid #E3E8EA; border-radius:14px; padding:14px 12px; cursor:pointer; text-align:left; font-family:'Manrope'; }
.cat-card.active{ border-color:var(--teal); background:#EAF3EF; }
.cat-card .cat-emoji{ font-size:20px; }
.cat-card .cat-name{ font-weight:700; font-size:13.5px; margin-top:6px; color:var(--navy); }
.cat-card .cat-desc{ font-size:11.5px; color:#748079; margin-top:2px; }
.item-row{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid #E7ECEE; border-radius:12px; padding:11px 13px; margin-bottom:8px; gap:10px; }
.item-thumb{ width:42px; height:42px; border-radius:9px; object-fit:cover; flex:none; background:#F0F3F4; cursor:pointer; }

/* ---- LIGHTBOX ---- */
.lightbox-backdrop{
  display:none; position:fixed; inset:0; background:rgba(4,24,38,.92); z-index:300;
  align-items:center; justify-content:center; flex-direction:column;
}
.lightbox-backdrop.open{ display:flex; }
.lightbox-img{ max-width:92vw; max-height:78vh; border-radius:12px; object-fit:contain; }
.lightbox-close{
  position:absolute; top:max(18px, env(safe-area-inset-top)); right:18px;
  background:rgba(255,255,255,.12); color:#fff; border:none; width:36px; height:36px;
  border-radius:50%; font-size:16px; cursor:pointer; z-index:2;
}
.lightbox-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  background:rgba(255,255,255,.12); color:#fff; border:none; width:44px; height:44px;
  border-radius:50%; font-size:24px; cursor:pointer; z-index:2;
}
.lightbox-prev{ left:12px; }
.lightbox-next{ right:12px; }
.lightbox-counter{ color:#C9D4D8; font-size:12.5px; margin-top:14px; font-weight:700; }
.item-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.manage-thumb{ width:44px; height:44px; border-radius:9px; object-fit:cover; flex:none; background:#F0F3F4; display:block; cursor:pointer; }
.manage-photo-strip{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.manage-photo-wrap{ position:relative; }
.manage-photo-remove{
  position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
  background:var(--coral); color:#fff; border:none; font-size:10px; cursor:pointer; line-height:1;
}
.image-upload-row{ margin-top:8px; }
.image-upload-row input[type="file"]{ font-size:11px; color:#6C7A73; }
.image-upload-hint{ font-size:10.5px; color:#95A29A; margin-top:4px; }
.item-row .item-name{ font-weight:600; font-size:13.5px; color:var(--navy); display:inline-flex; align-items:center; gap:6px; }
.color-swatch{ width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(0,0,0,.15); display:inline-block; flex:none; }
.item-row .item-price{ font-size:12px; color:#7A857E; }
.add-btn{ background:var(--teal); color:#fff; border:none; border-radius:8px; width:30px;height:30px; font-size:17px; line-height:1; cursor:pointer; }
.add-btn:active{ transform:scale(.92); }
.cart-bar{
  position:absolute; left:14px; right:14px; bottom:78px; background:var(--navy); color:#fff;
  border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  font-size:13.5px; box-shadow:0 10px 24px rgba(0,0,0,.28); z-index:15;
}
.cart-bar button{ background:var(--rust); color:#fff; border:none; border-radius:8px; padding:8px 13px; font-weight:700; font-size:12.5px; cursor:pointer; }
.track-wrap{ background:#fff; border:1px solid #E3E8EA; border-radius:16px; padding:16px; }
.track-step{ display:flex; gap:10px; padding:9px 0; }
.track-dot{ width:22px;height:22px; border-radius:50%; background:#E3E9E5; color:#8B978F; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none; font-weight:700; transition:all .25s ease; }
.track-dot.done{ background:var(--teal); color:#fff; }
.track-line{ width:2px; flex:1; background:#E3E9E5; margin-left:10.5px; }
.track-line.done{ background:var(--teal); }
.track-label{ font-size:13px; font-weight:600; color:var(--navy); }
.track-time{ font-size:11px; color:#8B978F; }

/* ---- FISH TAB ---- */
.angr-badge{
  display:inline-flex; align-items:center; gap:6px; background:#0F2E28; color:#BFE0D5;
  font-size:10px; font-weight:700; letter-spacing:.03em; padding:5px 10px; border-radius:999px; margin-bottom:12px;
}
.angr-badge .angr-dot{ width:6px;height:6px;border-radius:50%; background:#5FD8A6; box-shadow:0 0 0 3px rgba(95,216,166,.25); }
.hotbite{ background:linear-gradient(135deg, var(--teal-deep), var(--teal)); color:#fff; border-radius:16px; padding:16px; margin-bottom:14px; }
.hotbite .h-label{ font-size:11px; letter-spacing:.08em; color:#BFE0D5; font-weight:700; }
.hotbite .h-main{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:4px 0 6px; }
.hotbite .h-sub{ font-size:12px; color:#D8ECE4; line-height:1.5; }
.catch-row{ display:flex; gap:11px; background:#fff; border:1px solid #E7ECEE; border-radius:12px; padding:11px 13px; margin-bottom:8px; align-items:center; }
.catch-icon{ width:34px;height:34px; border-radius:9px; background:#EAF3EF; display:flex;align-items:center;justify-content:center; font-size:16px; flex:none; }
.catch-name{ font-weight:700; font-size:13px; color:var(--navy); }
.catch-meta{ font-size:11px; color:#7A857E; margin-top:1px; }
.log-catch-btn{
  width:100%; background:#fff; border:1.5px dashed #B7CFC5; color:var(--teal-deep); font-weight:700; font-size:13px;
  border-radius:12px; padding:11px; cursor:pointer; margin-bottom:14px; font-family:'Manrope';
}
.log-catch-btn:hover{ background:#F1F8F5; }
.log-form{ background:#fff; border:1px solid #E3E8EA; border-radius:14px; padding:14px; margin-bottom:14px; }
.log-form label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; letter-spacing:.03em; margin:8px 0 4px; }
.log-form select{ width:100%; padding:9px 10px; border-radius:9px; border:1px solid #DCE3E6; font-family:'Manrope'; font-size:13px; background:#F7F9FA; color:var(--navy); }
.log-form .log-submit{ margin-top:12px; width:100%; background:var(--teal); color:#fff; border:none; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
.new-pulse{ animation:pulseIn .6s ease; }
@keyframes pulseIn{ from{ background:#DCEEE9; } to{ background:#fff; } }

/* ---- ACCOUNT TAB ---- */
.tier-card{ border-radius:16px; padding:16px; margin-bottom:10px; border:1px solid #E3E8EA; background:#fff; }
.tier-card.active{ border-color:var(--rust); background:#E9F5F5; box-shadow:0 0 0 1px var(--rust) inset; }
.tier-top{ display:flex; justify-content:space-between; align-items:center; }
.tier-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; color:var(--navy); }
.tier-price{ font-size:12px; color:#7A857E; }
.tier-badge{ font-size:10px; font-weight:700; color:var(--rust); letter-spacing:.06em; }
.tier-perks{ margin:8px 0 0; padding-left:16px; font-size:12px; color:#5C6963; line-height:1.7; }

/* ---- ACCOUNT / AUTH ---- */
.points-card{
  background:linear-gradient(135deg, var(--navy), var(--navy-deep)); color:#fff;
  border-radius:16px; padding:18px; margin-bottom:14px;
}
.points-label{ font-size:11px; letter-spacing:.06em; color:#9FB4BB; font-weight:700; }
.points-value{ font-family:'Fraunces',serif; font-size:28px; font-weight:700; margin:4px 0 6px; }
.points-progress-track{ background:rgba(255,255,255,.15); border-radius:999px; height:8px; overflow:hidden; margin:8px 0 6px; }
.points-progress-fill{ background:var(--rust); height:100%; border-radius:999px; }
.points-sub{ font-size:11.5px; color:#C9D4D8; }
.dual-app-badge{
  display:inline-flex; align-items:center; gap:6px; background:rgba(2,184,194,.2); color:#8FE0E6;
  font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:999px; margin-top:10px;
}

/* ---- REWARDS ---- */
.reward-card{ background:#fff; border:1px solid #E3E8EA; border-radius:14px; padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.reward-card.locked{ opacity:.55; }
.reward-name{ font-weight:700; font-size:13.5px; color:var(--navy); }
.reward-desc{ font-size:11.5px; color:#7A857E; margin-top:1px; }
.reward-cost{ font-size:11px; color:var(--teal-deep); font-weight:700; margin-top:3px; }
.redeem-btn{ background:var(--rust); color:#fff; border:none; border-radius:9px; padding:9px 13px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; flex:none; }
.redeem-btn:disabled{ background:#D8DEE0; cursor:not-allowed; }
.my-code-card{ background:linear-gradient(135deg, var(--teal-deep), var(--teal)); color:#fff; border-radius:14px; padding:14px; margin-bottom:10px; }
.my-code-name{ font-weight:700; font-size:13px; }
.my-code-value{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; letter-spacing:.08em; margin:4px 0; }
.my-code-hint{ font-size:11px; color:#D8ECE4; }
.reward-code-row{ display:flex; gap:8px; margin-top:10px; }
.reward-code-row input{ flex:1; padding:9px 10px; border-radius:9px; border:1px solid #DCE3E6; font-family:'Manrope'; font-size:13px; color:var(--navy); text-transform:uppercase; }
.reward-code-row button{ background:var(--teal); color:#fff; border:none; border-radius:9px; padding:9px 14px; font-weight:700; font-size:12.5px; cursor:pointer; }
.applied-reward-line{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #F0F3F4; font-size:12.5px; color:var(--teal-deep); font-weight:700; }
.applied-reward-remove{ background:none; border:none; color:var(--coral); font-size:11px; font-weight:700; cursor:pointer; }

.auth-card{ background:#fff; border:1px solid #E3E8EA; border-radius:16px; padding:16px; margin-bottom:14px; }
.auth-toggle{ display:flex; gap:8px; margin-bottom:12px; }
.auth-toggle-btn{
  flex:1; padding:8px; border-radius:9px; border:1.5px solid #DCE3E6; background:#F7F9FA;
  font-size:12.5px; font-weight:700; color:var(--navy); cursor:pointer;
}
.auth-toggle-btn.active{ border-color:var(--rust); background:#FDEEE7; color:var(--rust); }
.auth-card input{ width:100%; padding:10px 11px; border-radius:9px; border:1px solid #DCE3E6; font-family:'Manrope'; font-size:13px; color:var(--navy); margin-bottom:8px; }
.auth-card label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; margin-bottom:4px; }
.auth-submit{ width:100%; background:var(--rust); color:#fff; border:none; border-radius:9px; padding:11px; font-weight:700; font-size:13px; cursor:pointer; margin-top:4px; }
.auth-error{ color:var(--coral); font-size:12px; margin-top:6px; min-height:16px; }
.auth-note{ font-size:11px; color:#8B978F; margin-top:10px; line-height:1.5; }

/* ---- MANAGE (OWNER) TAB ---- */
.manage-banner{ background:linear-gradient(135deg, var(--rust), var(--teal-deep)); color:#fff; border-radius:14px; padding:12px 15px; font-size:12px; line-height:1.5; margin-bottom:14px; font-weight:600; }
.manage-item{ background:#fff; border:1px solid #E7ECEE; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.manage-item .m-name{ font-weight:600; font-size:13px; color:var(--navy); }
.manage-item .m-price-view{ font-size:12px; color:#7A857E; margin-top:1px; }
.manage-item input[type="number"]{ width:62px; padding:6px 7px; border-radius:7px; border:1px solid #DCE3E6; font-family:'Manrope'; font-size:12.5px; }
.m-actions{ display:flex; gap:6px; flex:none; }
.m-btn{ border:none; border-radius:7px; width:28px;height:28px; font-size:13px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
.m-btn.edit{ background:#EAF3EF; color:var(--teal-deep); }
.m-btn.save{ background:var(--teal); color:#fff; }
.m-btn.del{ background:#FBEAE6; color:var(--coral); }
.add-product-form{ background:#fff; border:1.5px dashed #B7CFC5; border-radius:14px; padding:14px; margin-top:16px; }
.add-product-form label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; letter-spacing:.03em; margin:8px 0 4px; }
.add-product-form input{ width:100%; padding:9px 10px; border-radius:9px; border:1px solid #DCE3E6; font-family:'Manrope'; font-size:13px; background:#F7F9FA; color:var(--navy); }
.add-product-form .add-submit{ margin-top:12px; width:100%; background:var(--rust); color:#fff; border:none; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
.advance-btn{ width:100%; margin-top:10px; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:12.5px; cursor:pointer; }

/* ---- ORDERS QUEUE ---- */
.order-card{ background:#fff; border:1px solid #E3E8EA; border-radius:14px; padding:14px; margin-bottom:12px; }
.order-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.order-card-total{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--navy); }
.order-card-status{ font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:4px 9px; border-radius:999px; text-transform:uppercase; }
.status-confirming{ background:#FDEEE7; color:var(--rust); }
.status-placed{ background:#EAF3EF; color:var(--teal-deep); }
.status-assigned{ background:#E9F5F5; color:var(--teal); }
.status-en_route{ background:#E3E8EA; color:var(--navy); }
.order-card-items{ font-size:13px; color:var(--navy); margin-bottom:6px; }
.order-card-meta{ font-size:11.5px; color:#7A857E; margin-bottom:2px; }
.maps-link{ color:var(--teal-deep); font-weight:700; text-decoration:none; }
.maps-link:active{ opacity:.7; }
#ordersMap{ width:100%; height:210px; border-radius:14px; margin-bottom:14px; }
.orders-map-wrap{ background:var(--paper); border-radius:18px; padding:10px; border:1px solid #E3E8EA; margin-bottom:16px; }
.order-pin{
  width:20px; height:20px; border-radius:50%; background:var(--rust); border:2px solid #fff;
  box-shadow:0 2px 4px rgba(0,0,0,.35); position:relative;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:10.5px; font-weight:800; font-family:'Manrope';
}
.order-pin::before{
  content:''; position:absolute; inset:-9px; border-radius:50%;
  background:rgba(193,98,45,.4);
  animation: orderPulse 1.6s ease-out infinite;
  z-index:-1;
}
@keyframes orderPulse{
  0% { transform:scale(0.5); opacity:.9; }
  100% { transform:scale(2.4); opacity:0; }
}
.order-number-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%; background:var(--rust); color:#fff;
  font-size:11px; font-weight:800; margin-right:6px; flex:none;
}
.order-card-note{ font-size:12px; color:var(--coral); font-style:italic; margin:6px 0; }
.bonus-points-row{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
.bonus-given{ font-size:11px; font-weight:700; color:var(--teal-deep); background:#EAF3EF; padding:4px 8px; border-radius:999px; }

window.addEventListener('error', (e) => {
  showFatalError(e.error && e.error.message ? e.error.message : (e.message || 'Unknown script error'));
});
window.addEventListener('unhandledrejection', (e) => {
  showFatalError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
function showFatalError(message){
  const el = document.getElementById('appBody');
  const sub = document.getElementById('headerSub');
  if (!el) return;
  if (sub) sub.textContent = 'Something went wrong';
  el.innerHTML = `<div class="manage-banner" style="background:linear-gradient(135deg, var(--coral), #A8402C);">
      <div style="font-weight:800;margin-bottom:4px;">App error</div>
      <div style="font-weight:500;font-size:12px;line-height:1.6;word-break:break-word;">${message}</div>

}

// A plain, manual fetch straight to Supabase's auth endpoint, bypassing
// whatever the SDK's signInWithPassword() does internally (lock
// acquisition, extra headers, etc.) — in case that's what's tripping up
// certain network paths (e.g. iCloud Private Relay). We still hand the
// resulting tokens to the SDK afterward via setSession(), so everything
// downstream (RLS-authenticated calls, auto-refresh) keeps working the
// normal way once signed in.
async function manualSignInWithPassword(email, password){
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    let json = {};
    try { json = await res.json(); } catch(e){}
    if (!res.ok){
      return { data: null, error: { message: json.error_description || json.msg || json.error || `Sign-in failed (${res.status})` } };
    }
    const { data: sessionData, error: setErr } = await sb.auth.setSession({
      access_token: json.access_token,
      refresh_token: json.refresh_token
    });
    if (setErr) return { data: null, error: setErr };
    return { data: { user: sessionData.user, session: sessionData.session }, error: null };
  } catch (e){
    return { data: null, error: { message: 'Network error reaching Supabase: ' + (e.message || e) } };
  }
}

// Supabase's auth library uses a BroadcastChannel internally to sync login
// state across browser tabs. In some browsers, posting the session object
// across that channel throws "DataCloneError: The object can not be cloned."
// We don't need cross-tab session sync for a single-boat app, so we stub it
// out before creating the client — sessions still persist fine via
// localStorage, this only disables the live cross-tab push.
try {
  if (typeof BroadcastChannel !== 'undefined'){
    window.BroadcastChannel = function(){
      return { postMessage(){}, close(){}, addEventListener(){}, removeEventListener(){} };
    };
  }
} catch(e){}

try {

  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- TOAST ----
function showToast(msg){
  let toast = document.getElementById('toast');
  if (!toast){
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(()=> toast.classList.remove('show'), 2000);
}

// ---- LIGHTBOX (tap a product photo to see it full-size) ----
let lightboxImages = [];
let lightboxIndex = 0;
function openLightbox(images, startIndex = 0){
  if (!images || !images.length) return;
  lightboxImages = images;
  lightboxIndex = startIndex;
  renderLightbox();
  document.getElementById('lightboxBackdrop').classList.add('open');
}
function renderLightbox(){
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  const multi = lightboxImages.length > 1;
  document.getElementById('lightboxPrev').style.display = multi ? 'flex' : 'none';
  document.getElementById('lightboxNext').style.display = multi ? 'flex' : 'none';
  document.getElementById('lightboxCounter').textContent = multi ? `${lightboxIndex+1} / ${lightboxImages.length}` : '';
}
function closeLightbox(){
  document.getElementById('lightboxBackdrop').classList.remove('open');
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxBackdrop').addEventListener('click', (e)=>{
  if (e.target.id === 'lightboxBackdrop') closeLightbox();
});
document.getElementById('lightboxPrev').addEventListener('click', ()=>{
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
});
document.getElementById('lightboxNext').addEventListener('click', ()=>{
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  renderLightbox();
});

// ---- DISTANCE / ETA ----
// Universal maps link — opens whatever navigation app is default on the
// crew's phone (Apple Maps, Google Maps, etc.) instead of showing raw
// coordinates as unusable text.
function mapsLink(lat, lng){
  return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
}

function milesBetween(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function estimateEtaMinutes(){
  if (state.userLat == null || BOAT.lat == null) return 12;
  const miles = milesBetween(state.userLat, state.userLng, BOAT.lat, BOAT.lng);
  return Math.max(3, Math.round(miles / 16 * 60)); // ~16mph realistic small-boat pace w/ stops
}

// ---- WEATHER (Open-Meteo — free, no key) ----
const WEATHER_ICONS = {
  0:['☀️','Clear'], 1:['🌤️','Mostly clear'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Foggy'], 48:['🌫️','Foggy'],
  51:['🌦️','Light drizzle'], 53:['🌦️','Drizzle'], 55:['🌧️','Heavy drizzle'],
  61:['🌦️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Light snow'], 73:['🌨️','Snow'], 75:['❄️','Heavy snow'],
  80:['🌦️','Showers'], 81:['🌧️','Showers'], 82:['⛈️','Violent showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Storm w/ hail'], 99:['⛈️','Severe storm'],
};
function weatherIconFor(code){ return (WEATHER_ICONS[code] || ['🌊','Conditions'])[0]; }
function weatherDescFor(code){ return (WEATHER_ICONS[code] || ['🌊','Conditions'])[1]; }

async function fetchWeather(){
  const lat = state.userLat != null ? state.userLat : 35.086;
  const lng = state.userLng != null ? state.userLng : -81.059;
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`);
    const data = await res.json();
    state.weather = {
      temp: Math.round(data.current.temperature_2m),
      wind: Math.round(data.current.wind_speed_10m),
      code: data.current.weather_code
    };
  } catch(e){
    state.weather = false; // false = tried and failed, distinct from null = not yet loaded
  }
  if (state.tab === 'track') renderTrack();
}

let boatTimer = null;
function startBoatMotion(){
  if (boatTimer) return;
  boatTimer = setInterval(()=>{
    if (state.tab !== 'track') return;
    updateTrackLiveText();
    if (BOAT.hailed){
      const rem = remainingEtaMinutes();
      headerSub.textContent = rem === 0 ? 'Hailed · Arriving now' : `Hailed · ETA ${rem} min`;
    }
  }, 5000);
}

function render(){
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  const hasStaffAccess = state.ownerMode || state.staffMode;
  document.querySelectorAll('.owner-only').forEach(el => el.style.display = hasStaffAccess ? 'flex' : 'none');
  const badge = document.getElementById('cartBadge');
  if (badge){
    const count = cartCount();
    badge.textContent = count;
    badge.style.display = count > 0 ? 'flex' : 'none';
  }
  const ordersBadge = document.getElementById('ordersBadge');
  if (ordersBadge){
    const pending = ACTIVE_ORDERS.length;
    ordersBadge.textContent = pending;
    ordersBadge.style.display = pending > 0 ? 'flex' : 'none';
  }
  if (state.loading){
    headerSub.textContent = 'Loading…';
  } else if (SETTINGS.announcement && state.tab !== 'manage' && state.tab !== 'orders'){
    headerSub.textContent = '📢 ' + SETTINGS.announcement;
  } else {
    headerSub.textContent = state.ownerMode
      ? 'Owner view · editing live catalog'
      : state.staffMode
      ? 'Crew view · fulfilling orders'
      : (state.located
          ? (BOAT.hailed ? `Hailed · ETA ${remainingEtaMinutes()} min` : 'Location set · on today\u2019s route')
          : 'Set your location to get started');
  }

  if (state.tab === 'track') { renderTrack(); startBoatMotion(); }
  else if (state.tab === 'shop') renderShop();
  else if (state.tab === 'fish') renderFish();
  else if (state.tab === 'orders') renderOrders();
  else if (state.tab === 'manage') {
    if (state.countMode) renderCountMode();
    else if (state.showSettings) renderSettings();
    else renderManage();
  }
  else renderAccount();
}

// ---- TRACK TAB (real Leaflet map, live boat position from Supabase) ----
let trackMapInstance = null;
let boatLeafletMarker = null;
let userLeafletMarker = null;

function remainingEtaMinutes(){
  if (!BOAT.hailed) return 0;
  const updated = new Date(BOAT.updated_at || Date.now()).getTime();
  const elapsedMin = (Date.now() - updated) / 60000;
  return Math.max(0, Math.round(BOAT.eta_minutes - elapsedMin));
}

function etaLabel(){ return BOAT.hailed ? 'HAILED · ETA' : 'CURRENTLY NEAR'; }
function etaValueText(){
  if (BOAT.hailed){
    const rem = remainingEtaMinutes();
    return rem > 0 ? rem + ' min' : 'Arriving now';
  }
  return BOAT.current_stop_name || 'On the water';
}
function etaSubText(){
  const distNote = (state.userLat != null && BOAT.lat != null)
    ? ` (about ${milesBetween(state.userLat, state.userLng, BOAT.lat, BOAT.lng).toFixed(1)} mi away)`
    : '';
  return BOAT.hailed
    ? `Drift One has your hail and is headed your way${distNote}.`
    : `Drift One is out on the water today${distNote}.`;
}
function hailBtnLabel(){ return BOAT.hailed ? (remainingEtaMinutes() > 0 ? 'Cancel hail' : 'Arrived') : 'Request a stop'; }

function updateTrackLiveText(){
  if (state.tab !== 'track') return;
  const valEl = document.getElementById('etaValueText');
  const subEl = document.getElementById('etaSubText');
  const labelEl = document.getElementById('etaLabelText');
  const btn = document.getElementById('hailBtn');
  if (valEl) valEl.textContent = etaValueText();
  if (subEl) subEl.textContent = etaSubText();
  if (labelEl) labelEl.textContent = etaLabel();
  if (btn){ btn.textContent = hailBtnLabel(); btn.classList.toggle('sent', BOAT.hailed); }
  if (boatLeafletMarker && BOAT.lat != null) boatLeafletMarker.setLatLng([BOAT.lat, BOAT.lng]);
}

function renderTrack(){
  let html = `
    <div class="section-title">Where's Drift One</div>
    <div class="section-note">Live position, today's route, and your spot on the water.</div>`;

  html += renderWeatherChip();

  html += `<div class="map-wrap"><div id="trackMap"></div>
      <div class="legend">
        <span><i class="dot" style="background:#8FB6AC"></i>Route stop</span>
        <span><i class="dot" style="background:#02B8C2"></i>Your location</span>
        <span>🚤 Drift One</span>
      </div>
    </div>`;

  if (!state.located){
    html += `<button class="hail-btn" id="setLocBtn">Set my location</button>
      <div class="hail-hint">Uses your device's GPS so Drift One knows roughly where you are.</div>`;
  } else {
    html += `<div class="eta-card">
      <div class="eta-label" id="etaLabelText">${etaLabel()}</div>
      <div class="eta-value" id="etaValueText">${etaValueText()}</div>
      <div class="eta-sub" id="etaSubText">${etaSubText()}</div>
    </div>
    <button class="hail-btn ${BOAT.hailed?'sent':''}" id="hailBtn">${hailBtnLabel()}</button>
    <div class="hail-hint">${BOAT.hailed ? '' : 'Or just wait — it\u2019s already out on the water today.'}</div>`;
  }

  appBody.innerHTML = html;
  initTrackMap();

  const setLocBtn = appBody.querySelector('#setLocBtn');
  if (setLocBtn) setLocBtn.addEventListener('click', requestLocation);

  const hailBtn = appBody.querySelector('#hailBtn');
  if (hailBtn) hailBtn.addEventListener('click', async ()=>{
    const next = !BOAT.hailed;
    const hailNote = (state.userLat != null) ? `${state.userLat.toFixed(4)}, ${state.userLng.toFixed(4)}` : 'Location unavailable';
    const { data, error } = await sb.from('drift_boat_status')
      .update({
        hailed: next,
        hail_note: next ? hailNote : null,
        eta_minutes: next ? estimateEtaMinutes() : 22,
        updated_at: new Date().toISOString()
      })
      .eq('id', 1).select().single();
    if (error){ showToast('Could not send hail — try again'); return; }
    BOAT = data;
    showToast(next ? 'Drift One is on the way' : 'Hail cancelled');
    renderTrack();
  });
}

function renderWeatherChip(){
  if (state.weather === null){
    return `<div class="weather-chip loading">Loading conditions…</div>`;
  }
  if (state.weather === false){
    return '';
  }
  const w = state.weather;
  return `<div class="weather-chip">
    <div class="w-emoji">${weatherIconFor(w.code)}</div>
    <div>
      <div class="w-temp">${w.temp}°F</div>
      <div class="w-sub">${weatherDescFor(w.code)} · Wind ${w.wind} mph</div>
    </div>
  </div>`;
}

function requestLocation(){
  if (!navigator.geolocation){
    state.located = true;
    render();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.located = true;
      state.userLat = pos.coords.latitude;
      state.userLng = pos.coords.longitude;
      showToast('Location set');
      fetchWeather();
      render();
    },
    () => { state.located = true; showToast('Couldn\u2019t get GPS — using approximate area'); render(); },
    { timeout: 8000 }
  );
}

function initTrackMap(){
  const mapEl = document.getElementById('trackMap');
  if (!mapEl || typeof L === 'undefined') return;

  trackMapInstance = L.map('trackMap', { zoomControl:false, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '© OpenStreetMap contributors'
  }).addTo(trackMapInstance);

  const bounds = [];
  ROUTE.forEach(stop=>{
    L.circleMarker([stop.lat, stop.lng], {
      radius:5, color:'#fff', weight:2, fillColor:'#8FB6AC', fillOpacity:1
    }).addTo(trackMapInstance).bindTooltip(stop.name, {direction:'top'});
    bounds.push([stop.lat, stop.lng]);
  });

  if (BOAT.lat != null){
    boatLeafletMarker = L.marker([BOAT.lat, BOAT.lng], {
      icon: L.divIcon({ className:'', html:'<div class="boat-marker">🚤</div>', iconSize:[26,26], iconAnchor:[13,13] })
    }).addTo(trackMapInstance).bindTooltip('Drift One — live position', {direction:'top'});
    bounds.push([BOAT.lat, BOAT.lng]);
  }

  if (state.located && state.userLat != null){
    userLeafletMarker = L.marker([state.userLat, state.userLng], {
      icon: L.divIcon({ className:'', html:'<div class="user-marker"></div>', iconSize:[14,14], iconAnchor:[7,7] })
    }).addTo(trackMapInstance).bindTooltip('You', {direction:'top'});
    bounds.push([state.userLat, state.userLng]);
  }

  if (bounds.length) trackMapInstance.fitBounds(bounds, { padding:[24,24] });
}

function currentTier(){
  const earned = tierForPoints(state.loyaltyPoints);
  if (state.subscription && state.subscription.status === 'active'){
    const guaranteeId = state.subscription.paid_tier === 'pro' ? 'premium'
                       : state.subscription.paid_tier === 'plus' ? 'member' : null;
    if (guaranteeId){
      const guaranteed = TIERS.find(t => t.id === guaranteeId);
      if (guaranteed && TIERS.indexOf(guaranteed) > TIERS.indexOf(earned)) return guaranteed;
    }
  }
  return earned;
}
function currentDiscountPercent(){
  if (!state.isMember) return 0; // must actually join to get member pricing
  const base = currentTier().discountPercent;
  const bonus = state.isDualApp ? DUAL_APP_BONUS_PERCENT : 0;
  return Math.min(25, base + bonus); // capped so it never runs away
}
function lineItemUnitPrice(cartLine){
  const isCoolerFill = cartLine.name.toLowerCase().includes('cooler fill');
  if (isCoolerFill && currentTier().freeCoolerFill) return 0;
  if (state.appliedReward && state.appliedReward.reward_type === 'free_item' &&
      cartLine.name === state.appliedReward.free_item_name) return 0;
  return cartLine.price;
}
function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }
function cartSubtotalBeforeDiscount(){ return state.cart.reduce((a,c)=>a+lineItemUnitPrice(c)*c.qty,0); }
function rewardFlatDiscount(){
  return (state.appliedReward && state.appliedReward.reward_type === 'discount_amount')
    ? Math.min(cartSubtotalBeforeDiscount(), state.appliedReward.discount_amount) : 0;
}
function discountAmount(){ return +(cartSubtotalBeforeDiscount() * (currentDiscountPercent()/100)).toFixed(2); }
function cartTotal(){ return +Math.max(0, cartSubtotalBeforeDiscount() - discountAmount() - rewardFlatDiscount()).toFixed(2); }
function tipAmount(){ return +(cartTotal() * (state.tipPercent/100)).toFixed(2); }
function orderGrandTotal(){ return +(cartTotal() + tipAmount()).toFixed(2); }
function persistPaymentPref(){ try { localStorage.setItem('drift_payment_pref_v1', state.paymentMethod); } catch(e){} }
function persistPhone(){ try { localStorage.setItem('drift_phone_v1', state.phone); } catch(e){} }

// Orders above the current tier's threshold get a phone-confirmation step
// before the crew launches — a real deterrent against prank/fake orders
// that cost a real trip and real fuel. Higher tiers get a higher (or no)
// threshold as a real, earned perk.
// The Free tier's confirmation threshold is owner-adjustable via Settings
// (SETTINGS.confirm_threshold_base) — TIERS[0].confirmThreshold gets
// synced to it once settings load. Paid/earned tiers above Free keep
// their own fixed (better) thresholds.

function renderShop(){
  let html = `<div class="section-title">Order Ahead</div>
    <div class="section-note">Order now — Drift One brings it right to your boat.</div>`;

  if (state.delivery){
    html += renderTracker();
    appBody.innerHTML = html;
    return;
  }

  html += `<div class="cat-grid">`;
  Object.entries(CATALOG).forEach(([key,cat])=>{
    html += `<button class="cat-card ${state.activeCat===key?'active':''}" data-cat="${key}">
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-desc">${cat.desc}</div>
    </button>`;
  });
  html += `</div>`;

  if (state.cart.length){
    html += `<div class="cart-list">
      <div class="cart-list-title">YOUR ORDER</div>`;
    state.cart.forEach((c,i)=>{
      const unitPrice = lineItemUnitPrice(c);
      const isFree = unitPrice === 0 && c.price > 0;
      const isRewardFree = state.appliedReward && state.appliedReward.reward_type === 'free_item' && c.name === state.appliedReward.free_item_name;
      html += `<div class="cart-line">
        <div><div class="cart-line-name">${c.name}</div><div class="cart-line-price">${isFree ? `<s>$${c.price.toFixed(2)}</s> FREE (${isRewardFree ? 'reward' : 'member perk'})` : `$${unitPrice.toFixed(2)} each`}</div></div>
        <div class="qty-stepper">
          <button class="qty-btn" data-dec="${i}">−</button>
          <div class="qty-val">${c.qty}</div>
          <button class="qty-btn" data-inc="${i}">+</button>
        </div>
      </div>`;
    });
    if (currentDiscountPercent() > 0){
      html += `<div class="cart-line"><div class="cart-line-name" style="color:var(--teal-deep);">${currentDiscountPercent()}% member discount${state.isDualApp ? ' (incl. dual-app bonus)' : ''}</div><div class="cart-line-name" style="color:var(--teal-deep);">−$${discountAmount().toFixed(2)}</div></div>`;
    }

    if (state.appliedReward){
      html += `<div class="applied-reward-line">
        <span>🎁 ${state.appliedReward.name} (${state.appliedReward.code})${state.appliedReward.reward_type==='discount_amount' ? ` −$${rewardFlatDiscount().toFixed(2)}` : ''}</span>
        <button class="applied-reward-remove" id="removeRewardBtn">Remove</button>
      </div>`;
    } else if (state.customerId) {
      html += `<div class="reward-code-row">
        <input type="text" id="rewardCodeInput" placeholder="Reward code (optional)" maxlength="6">
        <button id="applyRewardBtn">Apply</button>
      </div>`;
    }

    html += `<textarea class="order-note" id="orderNote" rows="2" placeholder="Anything the crew should know? (optional)">${state.orderNote || ''}</textarea>

    <div class="pay-section">
      <div class="pay-section-label">YOUR PHONE (so the crew can reach you)</div>
      <input type="tel" class="order-note" id="orderPhone" style="min-height:auto; height:auto; margin-bottom:0;" placeholder="(555) 555-5555" value="${state.phone || ''}">
    </div>

    <div class="pay-section">
      <div class="pay-section-label">PAY THE CREW ON ARRIVAL</div>
      <div class="pay-options">
        <div class="pay-option ${state.paymentMethod==='cash'?'active':''}" data-pay="cash">💵 Cash</div>
        <div class="pay-option ${state.paymentMethod==='card'?'active':''}" data-pay="card">💳 Card reader</div>
      </div>
      <div class="pay-section-label">ADD A TIP</div>
      <div class="tip-row">
        <div class="tip-option ${state.tipPercent===0?'active':''}" data-tip="0">No tip</div>
        <div class="tip-option ${state.tipPercent===15?'active':''}" data-tip="15">15%</div>
        <div class="tip-option ${state.tipPercent===20?'active':''}" data-tip="20">20%</div>
        <div class="tip-option ${state.tipPercent===25?'active':''}" data-tip="25">25%</div>
      </div>
      <div class="pay-note">Payment happens right at the handoff — nothing changes hands until it's paid, cash or card.${orderGrandTotal() > currentTier().confirmThreshold ? ` Orders over $${currentTier().confirmThreshold} get a quick call to confirm before Drift One heads out.` : ''}</div>
    </div>
    </div>`;
  }

  if (!CATALOG[state.activeCat] || !CATALOG[state.activeCat].items.length){
    html += `<div class="section-note">Nothing in this category right now — check back soon.</div>`;
  } else {
    CATALOG[state.activeCat].items.forEach((item, i)=>{
      const soldOut = item.stock !== null && item.stock <= 0;
      const low = item.stock !== null && item.stock > 0 && item.stock <= LOW_STOCK_THRESHOLD;
      html += `<div class="item-row ${soldOut?'sold-out':''}">
        <div class="item-left">
          ${item.image ? `<img class="item-thumb" src="${item.image}" alt="${item.n}" data-lightbox="${state.activeCat}:${i}">` : ''}
          <div>
            <div class="item-name">${item.swatch ? `<span class="color-swatch" style="background:${item.swatch};"></span>` : ''}${item.n}</div>
            <div class="item-price">$${item.p.toFixed(2)}</div>
            ${soldOut ? `<div class="stock-note out">Sold out</div>` : ''}
            ${low ? `<div class="stock-note low">Only ${item.stock} left</div>` : ''}
          </div>
        </div>
        <button class="add-btn" data-add="${state.activeCat}:${i}" ${soldOut?'disabled':''}>+</button>
      </div>`;
    });
  }
  appBody.innerHTML = html;

  if (state.cart.length){
    const bar = document.createElement('div');
    bar.className = 'cart-bar';
    const count = cartCount(), grandTotal = orderGrandTotal();
    bar.innerHTML = `<span>${count} item${count>1?'s':''} · $${grandTotal.toFixed(2)}${state.tipPercent>0 ? ' (w/ tip)' : ''}</span>
      <button id="deliverBtn">${state.located ? 'Deliver to my boat' : 'Set location first'}</button>`;
    appBody.appendChild(bar);
    bar.querySelector('#deliverBtn').addEventListener('click', (e)=>{
      if (!state.located) { state.tab='track'; render(); return; }
      if (!state.phone || state.phone.trim().length < 7){
        showToast('Add a phone number so the crew can reach you');
        document.getElementById('orderPhone')?.focus();
        return;
      }
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Getting your location…';
      startDelivery();
    });
  }

  appBody.querySelectorAll('[data-pay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.paymentMethod = el.dataset.pay;
      persistPaymentPref();
      render();
    });
  });
  appBody.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tipPercent = Number(el.dataset.tip);
      render();
    });
  });

  const noteEl = appBody.querySelector('#orderNote');
  if (noteEl) noteEl.addEventListener('input', ()=>{ state.orderNote = noteEl.value; });

  const phoneEl = appBody.querySelector('#orderPhone');
  if (phoneEl) phoneEl.addEventListener('input', ()=>{ state.phone = phoneEl.value; persistPhone(); });

  const applyRewardBtn = appBody.querySelector('#applyRewardBtn');
  if (applyRewardBtn) applyRewardBtn.addEventListener('click', async ()=>{
    const code = document.getElementById('rewardCodeInput').value.trim().toUpperCase();
    if (!code) return;
    const { data, error } = await sb.from('drift_redemptions')
      .select('*, reward:drift_rewards(*)')
      .eq('code', code)
      .eq('user_id', state.customerId)
      .eq('status', 'pending')
      .maybeSingle();
    if (error || !data){ showToast('Code not found or already used'); return; }
    state.appliedReward = {
      redemptionId: data.id,
      code: data.code,
      name: data.reward.name,
      reward_type: data.reward.reward_type,
      discount_amount: data.reward.discount_amount != null ? Number(data.reward.discount_amount) : null,
      free_item_name: data.reward.free_item_name
    };
    showToast(`Applied: ${data.reward.name}`);
    render();
  });
  const removeRewardBtn = appBody.querySelector('#removeRewardBtn');
  if (removeRewardBtn) removeRewardBtn.addEventListener('click', ()=>{
    state.appliedReward = null;
    render();
  });

  appBody.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.activeCat = btn.dataset.cat; render(); });
  });
  appBody.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const [cat, i] = img.dataset.lightbox.split(':');
      const item = CATALOG[cat].items[Number(i)];
      if (item && item.images && item.images.length) openLightbox(item.images, 0);
    });
  });
  appBody.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [cat, i] = btn.dataset.add.split(':');
      const item = CATALOG[cat].items[Number(i)];
      const existing = state.cart.find(c=>c.cat===cat && c.id===item.id);
      const inCart = existing ? existing.qty : 0;
      if (item.stock !== null && inCart >= item.stock){
        showToast(`Only ${item.stock} ${item.n} available`);
        return;
      }
      if (existing) existing.qty++;
      else state.cart.push({cat, id:item.id, name:item.n, price:item.p, qty:1});
      persistCart();
      showToast(`Added ${item.n}`);
      render();
    });
  });
  appBody.querySelectorAll('[data-inc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const line = state.cart[Number(btn.dataset.inc)];
      const product = CATALOG[line.cat] && CATALOG[line.cat].items.find(p=>p.id===line.id);
      if (product && product.stock !== null && line.qty >= product.stock){
        showToast(`Only ${product.stock} available`);
        return;
      }
      line.qty++;
      persistCart();
      render();
    });
  });
  appBody.querySelectorAll('[data-dec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = Number(btn.dataset.dec);
      state.cart[i].qty--;
      if (state.cart[i].qty <= 0) state.cart.splice(i,1);
      persistCart();
      render();
    });
  });
}

async function decrementStockForOrder(cartItems){
  for (const c of cartItems){
    const product = CATALOG[c.cat] && CATALOG[c.cat].items.find(p=>p.id===c.id);
    if (product && product.stock !== null){
      const newStock = Math.max(0, product.stock - c.qty);
      product.stock = newStock;
      await sb.from('drift_products').update({ stock: newStock }).eq('id', c.id);
    }
  }
}

// Grabs the phone's actual current position right now, rather than
// relying on whatever was captured whenever the customer first tapped
// "Set my location" — which could be from 20 minutes and a quarter
// mile of drifting ago. Falls back silently to the last-known
// position if a fresh fix isn't available in time.
function getFreshLocation(timeoutMs = 6000){
  return new Promise((resolve)=>{
    if (!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy:true, timeout: timeoutMs, maximumAge: 0 }
    );
  });
}

async function startDelivery(){
  const fresh = await getFreshLocation();
  if (fresh){ state.userLat = fresh.lat; state.userLng = fresh.lng; }

  const orderNumber = 'DR-' + Date.now().toString().slice(-6);
  const total = orderGrandTotal();
  const needsConfirm = total > currentTier().confirmThreshold;
  const cartSnapshot = state.cart.slice();
  const rewardSnapshot = state.appliedReward;

  const { data: orderRow, error } = await sb.from('drift_orders').insert({
    items: cartSnapshot.map(c => ({ id:c.id, name:c.name, price:c.price, qty:c.qty })),
    subtotal: cartTotal(),
    tip: tipAmount(),
    total,
    payment_method: state.paymentMethod,
    phone: state.phone,
    location_note: (state.userLat != null) ? `${state.userLat.toFixed(4)}, ${state.userLng.toFixed(4)}` : null,
    lat: state.userLat,
    lng: state.userLng,
    note: state.orderNote || null,
    status: needsConfirm ? 'confirming' : 'placed',
    user_id: state.customerId,
    redemption_id: rewardSnapshot ? rewardSnapshot.redemptionId : null,
    reward_note: rewardSnapshot ? `${rewardSnapshot.name} (${rewardSnapshot.code})` : null
  }).select().single();

  if (error){ showToast('Could not place order — try again'); render(); return; }

  state.delivery = {
    dbId: orderRow.id,
    status: orderRow.status,
    orderNumber,
    items: cartSnapshot,
    note: state.orderNote,
    phone: state.phone,
    subtotal: cartTotal(),
    tip: tipAmount(),
    total,
    paymentMethod: state.paymentMethod,
    needsConfirm,
    rewardNote: orderRow.reward_note
  };
  await decrementStockForOrder(cartSnapshot);
  state.cart = [];
  state.orderNote = '';
  state.appliedReward = null;
  persistCart();
  await fetchMyRedemptions();
  render();
  showToast(needsConfirm ? `Order placed · confirming by phone first` : `Order placed · ${orderNumber}`);
  // From here, status changes come from the crew fulfilling the order for
  // real (Orders tab) — no more client-side simulation. See
  // subscribeRealtime()'s drift_orders channel.
}

function timeAgo(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr ago`;
  return `${Math.round(hrs/24)} d ago`;
}

function computeHotBite(){
  if (!HOT_BITE_FEED.length) return null;
  const counts = {};
  HOT_BITE_FEED.forEach(c=>{ counts[c.species] = (counts[c.species]||0) + 1; });
  let topSpecies = HOT_BITE_FEED[0].species, max = 0;
  Object.entries(counts).forEach(([sp,ct])=>{ if (ct > max){ max = ct; topSpecies = sp; } });
  const matching = HOT_BITE_FEED.filter(c=>c.species===topSpecies);
  const baitCounts = {};
  matching.forEach(c=>{ if (c.bait) baitCounts[c.bait] = (baitCounts[c.bait]||0)+1; });
  const baitEntries = Object.entries(baitCounts);
  let topBait = baitEntries.length ? baitEntries[0][0] : 'various bait', bmax = 0;
  baitEntries.forEach(([b,ct])=>{ if (ct > bmax){ bmax = ct; topBait = b; } });
  return {species: topSpecies, bait: topBait, spot: matching[0].spot};
}

let ordersMapInstance = null;
function initOrdersMap(ordersWithLocation){
  const mapEl = document.getElementById('ordersMap');

  ordersMapInstance = L.map('ordersMap', { zoomControl:false, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

  }).addTo(ordersMapInstance);

  const bounds = [];
  if (BOAT.lat != null){
    L.marker([BOAT.lat, BOAT.lng], {
      icon: L.divIcon({ className:'', html:'<div class="boat-marker">🚤</div>', iconSize:[26,26], iconAnchor:[13,13] })

      const canAfford = state.loyaltyPoints >= r.points_cost;
      html += `<div class="reward-card ${canAfford?'':'locked'}">
        <div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-desc">${r.description || ''}</div>
          <div class="reward-cost">${r.points_cost} pts</div>
        </div>
        <button class="redeem-btn" data-redeem="${r.id}" ${canAfford?'':'disabled'}>Redeem</button>
      </div>`;
    });

    html += `${renderCustomerSettingsCard()}<button class="hail-btn" id="signOutCustomerBtn" style="background:none;border:1.5px solid #DCE3E6;color:var(--navy);margin-bottom:14px;margin-top:6px;">Sign Out</button>`;
  }

  html += `<div class="section-title" style="font-size:16px;">How tiers work</div>
    <div class="section-note">Earned through real activity — 1 point per $1 spent on a completed order, 5 points per catch logged (Angr or Drift). No subscription, nothing to cancel.</div>`;
  TIERS.forEach(t=>{
    const active = state.customerId && t.id === currentTier().id;
    html += `<div class="tier-card ${active?'active':''}">
      <div class="tier-top">
        <div class="tier-name">${t.name}</div>
        <div class="tier-price">${t.minPoints}+ pts</div>
      </div>
      ${active ? '<div class="tier-badge">YOUR CURRENT TIER</div>' : ''}
      <ul class="tier-perks">${t.perks.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>`;
  });

  html += `<div class="section-title" style="font-size:16px;margin-top:20px;">Captain's Club</div>
    <div class="section-note">A separate paid track that instantly guarantees a tier, no points required. Cancel anytime from the email receipt Stripe sends you.</div>`;
  PAID_TIERS.forEach(pt=>{
    const link = state.customerId
      ? `${pt.paymentLink}?client_reference_id=${state.customerId}&prefilled_email=${encodeURIComponent(state.customerEmail)}`
      : null;
    html += `<div class="tier-card">
      <div class="tier-top">
        <div class="tier-name">${pt.name}</div>
        <div class="tier-price">${pt.price}</div>
      </div>
      <div class="tier-perks" style="padding-left:0;list-style:none;margin-bottom:10px;">${pt.desc}</div>
      ${link
        ? `<a href="${link}" target="_blank" rel="noopener" class="redeem-btn" style="display:block;text-align:center;text-decoration:none;">Subscribe</a>`
        : `<div class="section-note" style="margin:0;">Sign in above to subscribe.</div>`
      }
    </div>`;
  });

  appBody.innerHTML = html;
  wireCustomerSettingsCard();

  appBody.querySelectorAll('[data-authmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.authFormMode = btn.dataset.authmode; render(); });
  });
  const authSubmit = appBody.querySelector('#authSubmit');
  if (authSubmit) authSubmit.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';
    if (!email || password.length < 6){ errEl.textContent = 'Enter a valid email and a password (6+ characters).'; return; }
    const { data, error } = state.authFormMode === 'signin'
      ? await manualSignInWithPassword(email, password)
      : await sb.auth.signUp({ email, password });
    if (error){ errEl.textContent = error.message; return; }
    if (state.authFormMode === 'signup' && !data.session){
      errEl.textContent = '';
      showToast('Check your email to confirm your account, then sign in.');
      return;
    }
    await onCustomerSignedIn(data.session.user);
    if (state.staffMode) await fetchActiveOrders();
    showToast(state.staffMode ? 'Signed in — crew access unlocked' : 'Signed in — welcome to Drift');
    render();
  });
  const signOutBtn = appBody.querySelector('#signOutCustomerBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', async ()=>{
    await sb.auth.signOut();
    currentAuthUserId = null;
    state.customerId = null;
    state.customerEmail = null;
    state.loyaltyPoints = 0;
    state.isDualApp = false;
    state.subscription = null;
    state.staffMode = false;
    state.isMember = false;
    MY_REDEMPTIONS = [];
    if (state.tab === 'orders' || state.tab === 'manage') state.tab = 'shop';
    render();
  });

  const joinBtn = appBody.querySelector('#joinRewardsBtn');
  if (joinBtn) joinBtn.addEventListener('click', async ()=>{
    joinBtn.disabled = true;
    const { error } = await sb.from('drift_members').insert({ user_id: state.customerId });
    if (error){
      showToast('Could not join — try again');
      joinBtn.disabled = false;
      return;
    }
    state.isMember = true;
    await fetchLoyaltyPoints();
    showToast('Welcome to Drift Rewards!');
    render();
  });

  appBody.querySelectorAll('[data-redeem]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const { data, error } = await sb.rpc('redeem_reward', { p_reward_id: btn.dataset.redeem });
      if (error){ showToast(error.message || 'Could not redeem'); btn.disabled = false; return; }
      await Promise.all([fetchLoyaltyPoints(), fetchMyRedemptions()]);
      showToast(`Redeemed! Code: ${data.code}`);
      render();
    });
  });
}

async function onCustomerSignedIn(user){
  state.customerId = user.id;
  state.customerEmail = user.email;
  currentAuthUserId = user.id;
  await Promise.all([fetchLoyaltyPoints(), checkDualAppStatus(), fetchSubscription(), checkStaffRole(), fetchMyRedemptions(), checkMembership()]);
}

async function checkMembership(){
  if (!state.customerId) { state.isMember = false; return; }
  const { data } = await sb.from('drift_members').select('user_id').eq('user_id', state.customerId).maybeSingle();
  state.isMember = !!data;
}

async function fetchLoyaltyPoints(){
  if (!state.customerId) return;
  const { data } = await sb.from('drift_loyalty').select('points').eq('user_id', state.customerId).maybeSingle();
  state.loyaltyPoints = data ? data.points : 0;
}

async function checkDualAppStatus(){
  if (!state.customerId) return;
  const { count } = await sb.from('catches').select('id', { count:'exact', head:true }).eq('user_id', state.customerId);
  state.isDualApp = (count || 0) > 0;
}

async function fetchSubscription(){
  if (!state.customerId) return;
  const { data } = await sb.from('drift_subscriptions').select('*').eq('user_id', state.customerId).maybeSingle();
  state.subscription = data || null;
}

async function fetchSettings(){
  const { data, error } = await sb.from('drift_settings').select('*').eq('id', 1).single();
  if (error) return;
  SETTINGS = data;
  const free = TIERS.find(t => t.id === 'free');
  if (free) free.confirmThreshold = SETTINGS.confirm_threshold_base;
}

async function fetchRewards(){
  const { data, error } = await sb.from('drift_rewards').select('*').eq('active', true).order('points_cost');
  if (!error) REWARDS = data || [];
}

async function fetchMyRedemptions(){
  if (!state.customerId) { MY_REDEMPTIONS = []; return; }
  const { data, error } = await sb.from('drift_redemptions')
    .select('*, reward:drift_rewards(*)')
    .eq('user_id', state.customerId)
    .eq('status', 'pending')
    .order('redeemed_at', { ascending:false });
  if (!error) MY_REDEMPTIONS = data || [];
}

async function checkStaffRole(){
  if (state.ownerMode) return; // owner already has full access
  try {
    const { data } = await sb.rpc('is_staff');
    state.staffMode = !!data;
  } catch(e){ state.staffMode = false; }
}

function renderManage(){
  const lowItems = [];
  Object.values(CATALOG).forEach(cat => cat.items.forEach(item=>{
    if (item.stock !== null && item.stock <= LOW_STOCK_THRESHOLD) lowItems.push(item);
  }));

  const posLabel = BOAT.current_stop_name
    ? BOAT.current_stop_name
    : (BOAT.lat != null ? `${BOAT.lat.toFixed(4)}, ${BOAT.lng.toFixed(4)}` : 'Unknown');

  const roleLabel = state.ownerMode ? `Owner View — signed in as ${ownerEmail || 'owner'}` : `Crew View — signed in as ${state.customerEmail || 'crew'}`;

  let html = `
    <div class="manage-banner">${roleLabel}. Changes here go straight to Supabase — every customer's app updates live.</div>
    <div class="section-title" style="font-size:16px;">Boat Position</div>
    <div class="section-note">Currently at <b>${posLabel}</b>${liveTrackingWatchId ? ' · 🛰️ Live tracking ON' : ''}</div>
    <button class="advance-btn" id="liveTrackBtn" style="background:${liveTrackingWatchId ? 'var(--coral)' : 'var(--teal)'};">
      ${liveTrackingWatchId ? '🛑 Stop Live Tracking' : '🛰️ Start Live Tracking (uses my GPS)'}
    </button>
    <div class="section-note" style="margin-top:10px;">Or jump to a known stop:</div>
    <div class="cat-grid">`;
  ROUTE.forEach(stop=>{
    html += `<button class="cat-card" data-jump="${stop.name}" style="text-align:center;">
      <div class="cat-name" style="margin-top:0;">${stop.name}</div>
